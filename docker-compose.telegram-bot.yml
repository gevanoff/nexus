x-telegram-bot: &telegram-bot
  build:
    context: ./services/telegram-bot
    dockerfile: Dockerfile
  env_file:
    - ./.env
  networks:
    - nexus
  restart: unless-stopped

x-telegram-environment: &telegram-environment
  GATEWAY_BEARER_TOKEN: ${GATEWAY_BEARER_TOKEN:-}
  GATEWAY_BASE_URL: ${TELEGRAM_GATEWAY_BASE_URL:-http://gateway:8800}
  MAX_HISTORY: ${TELEGRAM_MAX_HISTORY:-20}
  LOG_LEVEL: ${TELEGRAM_LOG_LEVEL:-info}
  TELEGRAM_MAX_MESSAGE: ${TELEGRAM_MAX_MESSAGE:-3900}
  TELEGRAM_HEALTHCHECK_TIMEOUT_MS: ${TELEGRAM_HEALTHCHECK_TIMEOUT_MS:-5000}
  TELEGRAM_HEALTHCHECK_NETWORK_RETRIES: ${TELEGRAM_HEALTHCHECK_NETWORK_RETRIES:-2}
  TELEGRAM_HEALTHCHECK_RETRY_DELAY_MS: ${TELEGRAM_HEALTHCHECK_RETRY_DELAY_MS:-250}
  TELEGRAM_HEALTHCHECK_COMPLETION_ENABLED: ${TELEGRAM_HEALTHCHECK_COMPLETION_ENABLED:-false}
  TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
  TELEGRAM_REQUIRE_MENTION: ${TELEGRAM_REQUIRE_MENTION:-true}
  TELEGRAM_EXCLUSIVE_BOT_MENTIONS: ${TELEGRAM_EXCLUSIVE_BOT_MENTIONS:-true}
  TELEGRAM_GATEWAY_EXEC: ${TELEGRAM_GATEWAY_EXEC:-false}
  TELEGRAM_MEMORY_ENABLED: ${TELEGRAM_MEMORY_ENABLED:-false}
  TELEGRAM_MEMORY_TIMEOUT_MS: ${TELEGRAM_MEMORY_TIMEOUT_MS:-10000}

services:
  # The existing Nexus bot becomes ai2's host identity. TELEGRAM_TOKEN remains
  # a compatibility fallback until TELEGRAM_AI2_TOKEN is provisioned.
  telegram-bot:
    <<: *telegram-bot
    container_name: nexus-telegram-bot
    environment:
      <<: *telegram-environment
      TELEGRAM_TOKEN: ${TELEGRAM_AI2_TOKEN:-}
      TELEGRAM_TOKEN_FALLBACK: ${TELEGRAM_TOKEN:-}
      GATEWAY_MODEL: ${TELEGRAM_AI2_MODEL:-ai2-chat}
      TELEGRAM_MENTION_PATTERNS: ${TELEGRAM_AI2_MENTION_PATTERNS:-Nexus,ai2}

  telegram-bot-ada2:
    <<: *telegram-bot
    profiles: [host-bots]
    container_name: nexus-telegram-bot-ada2
    environment:
      <<: *telegram-environment
      TELEGRAM_TOKEN: ${TELEGRAM_ADA2_TOKEN:-}
      GATEWAY_MODEL: ${TELEGRAM_ADA2_MODEL:-ada2-chat}
      TELEGRAM_MENTION_PATTERNS: ${TELEGRAM_ADA2_MENTION_PATTERNS:-ada2}

  telegram-bot-stackrot:
    <<: *telegram-bot
    profiles: [host-bots]
    container_name: nexus-telegram-bot-stackrot
    environment:
      <<: *telegram-environment
      TELEGRAM_TOKEN: ${TELEGRAM_STACKROT_TOKEN:-}
      GATEWAY_MODEL: ${TELEGRAM_STACKROT_MODEL:-stackrot-chat}
      TELEGRAM_MENTION_PATTERNS: ${TELEGRAM_STACKROT_MENTION_PATTERNS:-stackrot}

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
