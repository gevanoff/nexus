services:
  # Telegram Bot Service - Chat bridge from Telegram to Gateway APIs
  telegram-bot:
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
    container_name: nexus-telegram-bot
    env_file:
      - ./.env
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - GATEWAY_BEARER_TOKEN=${GATEWAY_BEARER_TOKEN:-}
      - GATEWAY_BASE_URL=${TELEGRAM_GATEWAY_BASE_URL:-http://gateway:8800}
      - GATEWAY_MODEL=${TELEGRAM_GATEWAY_MODEL:-fast}
      - MAX_HISTORY=${TELEGRAM_MAX_HISTORY:-20}
      - LOG_LEVEL=${TELEGRAM_LOG_LEVEL:-info}
      - TELEGRAM_MAX_MESSAGE=${TELEGRAM_MAX_MESSAGE:-3900}
      - TELEGRAM_HEALTHCHECK_TIMEOUT_MS=${TELEGRAM_HEALTHCHECK_TIMEOUT_MS:-5000}
      - TELEGRAM_ALLOWED_CHATS=${TELEGRAM_ALLOWED_CHATS:-}
      - TELEGRAM_REQUIRE_MENTION=${TELEGRAM_REQUIRE_MENTION:-false}
      - TELEGRAM_EXCLUSIVE_BOT_MENTIONS=${TELEGRAM_EXCLUSIVE_BOT_MENTIONS:-true}
      - TELEGRAM_MENTION_PATTERNS=${TELEGRAM_MENTION_PATTERNS:-}
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
