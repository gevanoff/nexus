services:
  chatterbox-tts:
    build:
      context: ./services/chatterbox-tts
      dockerfile: Dockerfile
    container_name: nexus-chatterbox-tts
    ports:
      - "${CHATTERBOX_TTS_PORT:-9188}:9188"
    environment:
      - CHATTERBOX_TTS_DEVICE=${CHATTERBOX_TTS_DEVICE:-cuda}
      - CHATTERBOX_TTS_REFS_DIR=${CHATTERBOX_TTS_REFS_DIR:-/var/lib/tts_refs}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-${HF_TOKEN:-}}
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/tts_refs:/var/lib/tts_refs:ro
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CHATTERBOX_TTS_CUDA_VISIBLE_DEVICES:-1}"]
              capabilities: [gpu]
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9188/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  chatterbox-tts-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=chatterbox-tts
      - NEXUS_SERVICE_BASE_URL=${CHATTERBOX_TTS_ADVERTISE_BASE_URL:-${CHATTERBOX_TTS_BASE_URL:-http://chatterbox-tts:9188}}
      - NEXUS_SERVICE_HEALTH_URL=http://chatterbox-tts:9188/readyz
      - NEXUS_SERVICE_METADATA_URL=${CHATTERBOX_TTS_ADVERTISE_BASE_URL:-${CHATTERBOX_TTS_BASE_URL:-http://chatterbox-tts:9188}}/v1/metadata
      - NEXUS_SERVICE_BACKEND_CLASS=chatterbox_tts
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - chatterbox-tts
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
