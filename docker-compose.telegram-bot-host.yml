# Standalone remote host-bot projects must not inherit the main Nexus project's
# fixed 172.28.0.0/16 subnet. Docker allocates a non-overlapping project network.
services:
  telegram-bot-ada2:
    extends:
      file: docker-compose.telegram-bot.yml
      service: telegram-bot-ada2

  telegram-bot-stackrot:
    extends:
      file: docker-compose.telegram-bot.yml
      service: telegram-bot-stackrot

  telegram-bot-meltdown:
    extends:
      file: docker-compose.telegram-bot.yml
      service: telegram-bot-meltdown

networks:
  nexus: {}
