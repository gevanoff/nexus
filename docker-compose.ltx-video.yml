services:
  ltx-video:
    build:
      context: ./services/media-generation
      dockerfile: Dockerfile
    container_name: nexus-ltx-video
    ports:
      - "${LTX_VIDEO_PORT:-9180}:9180"
    environment:
      - NEXUS_MEDIA_ENGINE=ltx
      - NEXUS_MEDIA_SERVICE_NAME=ltx-video
      - NEXUS_MEDIA_MODEL_ID=${LTX_VIDEO_MODEL_ID:-Lightricks/LTX-2.3-22B-distilled}
      - MEDIA_PORT=9180
      - MEDIA_DATA_DIR=/data
      - MEDIA_UPSTREAM_DIR=/data/app
      - MEDIA_OUTPUT_ROOT=/data/outputs
      - MEDIA_PUBLIC_BASE_URL=${LTX_VIDEO_ADVERTISE_BASE_URL:-}
      - MEDIA_GENERATION_TIMEOUT_SEC=${LTX_VIDEO_TIMEOUT_SEC:-3600}
      - MEDIA_UPDATE_ON_START=${LTX_VIDEO_UPDATE_ON_START:-false}
      - LTX_REPO_URL=${LTX_REPO_URL:-https://github.com/Lightricks/LTX-2.git}
      - LTX_REPO_REF=${LTX_REPO_REF:-}
      - LTX_UV_SYNC_ARGS=${LTX_UV_SYNC_ARGS:-}
      - LTX_DISTILLED_CHECKPOINT_PATH=${LTX_DISTILLED_CHECKPOINT_PATH:-/data/models/ltx-2.3-22b-distilled-1.1.safetensors}
      - LTX_SPATIAL_UPSAMPLER_PATH=${LTX_SPATIAL_UPSAMPLER_PATH:-/data/models/ltx-2.3-spatial-upscaler-x2-1.1.safetensors}
      - LTX_GEMMA_ROOT=${LTX_GEMMA_ROOT:-/data/models/gemma-3-12b-it-qat-q4_0-unquantized}
      - LTX_QUANTIZATION=${LTX_QUANTIZATION:-fp8-cast}
      - HF_HOME=${LTX_HF_HOME:-${HF_HOME:-/data/huggingface}}
      - HUGGINGFACE_HUB_CACHE=${LTX_HF_HOME:-${HF_HOME:-/data/huggingface}}/hub
      - XDG_CACHE_HOME=/data/cache
      - NVIDIA_VISIBLE_DEVICES=${LTX_CUDA_VISIBLE_DEVICES:-0}
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${LTX_DATA_BIND_SOURCE:-${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/ltx-video}:/data
      - ${HF_HOME_BIND_SOURCE:-/data/huggingface}:${LTX_HF_HOME:-${HF_HOME:-/data/huggingface}}
    gpus: all
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9180/readyz"]
      interval: 30s
      timeout: 15s
      start_period: 300s
      retries: 5

  ltx-video-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=ltx-video
      - NEXUS_SERVICE_BASE_URL=${LTX_VIDEO_ADVERTISE_BASE_URL:-${LTX_VIDEO_BASE_URL:-http://ltx-video:9180}}
      - NEXUS_SERVICE_HEALTH_URL=http://ltx-video:9180/readyz
      - NEXUS_SERVICE_BACKEND_CLASS=ltx_video
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - ltx-video
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
