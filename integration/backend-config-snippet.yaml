backends:
  hf_nvidia_nvidia_nemotron_nano_9b_v2:
    class: hf_nvidia_nvidia_nemotron_nano_9b_v2
    provider: shim
    base_url: ${HF_NVIDIA_NVIDIA_NEMOTRON_NANO_9B_V2_BASE_URL}
    description: HF NVIDIA-Nemotron-Nano-9B-v2 (transformers)
    supported_capabilities:
      - chat
    concurrency_limits:
      chat: 1
    health:
      liveness: /health
      readiness: /readyz
    payload_policy: {}
    api_path: /v1/chat/completions
    metadata:
      model: nvidia/NVIDIA-Nemotron-Nano-9B-v2
      runtime: transformers
      device: cuda
      max_new_tokens: 2048
      temperature: 0.7
      top_p: 0.9
      top_k: 50