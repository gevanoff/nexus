services:
  # Image Generation Service (InvokeAI)
  # Shared host paths:
  # - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/images/* is the images service's state and models cache
  images:
    build:
      context: ./services/images
      dockerfile: Dockerfile
    container_name: nexus-images
    ports:
      - "${IMAGES_PORT:-7860}:7860"
    environment:
      # OpenAI Images API shim (InvokeAI-compatible)
      - SHIM_MODE=${IMAGES_SHIM_MODE:-stub}
      - SHIM_PORT=7860
      # Legacy/default workflow. Its family is auto-detected and included in the routing map.
      - SHIM_GRAPH_TEMPLATE_PATH=${SHIM_GRAPH_TEMPLATE_PATH:-/app/shim/graph_template.json}
      # Optional family -> workflow map. Values may be paths or objects with path/output_node_id.
      # Example:
      # {"sdxl":"/data/workflows/sdxl.json","flux":{"path":"/data/workflows/flux.json","output_node_id":"output"}}
      - SHIM_GENERATION_WORKFLOWS_JSON=${SHIM_GENERATION_WORKFLOWS_JSON:-}
      # InvokeAI base-generation models normally have type=main. Override only for a verified InvokeAI version/model type.
      - SHIM_GENERATION_MODEL_TYPES=${SHIM_GENERATION_MODEL_TYPES:-main}
      # InvokeAI runs batch items serially; allow long SD3/FLUX batches to finish.
      - SHIM_TIMEOUT_S=${SHIM_TIMEOUT_S:-900}
      # Reference-image workflow templates. Purpose-specific paths take priority.
      - SHIM_EDIT_GRAPH_TEMPLATE_PATH=${SHIM_EDIT_GRAPH_TEMPLATE_PATH:-}
      - SHIM_IMG2IMG_GRAPH_TEMPLATE_PATH=${SHIM_IMG2IMG_GRAPH_TEMPLATE_PATH:-}
      - SHIM_INPAINT_GRAPH_TEMPLATE_PATH=${SHIM_INPAINT_GRAPH_TEMPLATE_PATH:-}
      - SHIM_COMPOSITION_GRAPH_TEMPLATE_PATH=${SHIM_COMPOSITION_GRAPH_TEMPLATE_PATH:-}
      - SHIM_STYLE_GRAPH_TEMPLATE_PATH=${SHIM_STYLE_GRAPH_TEMPLATE_PATH:-}
      - SHIM_CONTROLNET_GRAPH_TEMPLATE_PATH=${SHIM_CONTROLNET_GRAPH_TEMPLATE_PATH:-}
      # Optional: only used when SHIM_MODE=invokeai_queue
      - INVOKEAI_BASE_URL=${IMAGES_SHIM_INVOKEAI_BASE_URL:-${INVOKEAI_BASE_URL:-http://invokeai:9090}}
    volumes:
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/images/data:/data
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/images/models:/data/models
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/images/workflows:/data/workflows:ro
    networks:
      - nexus
    restart: unless-stopped
    # Note: GPU is only required if/when you run a real image backend.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=3).read(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  images-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=images
      - NEXUS_SERVICE_BASE_URL=${IMAGES_ADVERTISE_BASE_URL:-${IMAGES_HTTP_BASE_URL:-http://images:7860}}
      - NEXUS_SERVICE_HEALTH_URL=http://images:7860/readyz
      - NEXUS_SERVICE_METADATA_URL=${IMAGES_ADVERTISE_BASE_URL:-${IMAGES_HTTP_BASE_URL:-http://images:7860}}/v1/metadata
      - NEXUS_SERVICE_BACKEND_CLASS=gpu_heavy
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - images
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
