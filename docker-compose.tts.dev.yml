services:
  # Dev override for the TTS service.
  # Shared host paths:
  # - ${NEXUS_RUNTIME_ROOT:-./.runtime}/tts-dev/data is TTS state for dev
  tts:
    container_name: nexus-tts-dev
    ports:
      - "${DEV_TTS_PORT:-19940}:9940"
    environment:
      - POCKET_TTS_HOST=0.0.0.0
      - POCKET_TTS_PORT=9940
      - POCKET_TTS_BACKEND=${DEV_POCKET_TTS_BACKEND:-auto}
    volumes:
      - ${NEXUS_RUNTIME_ROOT:-./.runtime}/tts-dev/data:/data
      - ${NEXUS_RUNTIME_ROOT:-./.runtime}/tts_refs:/var/lib/tts_refs:ro

networks:
  nexus:
    name: nexus-dev

volumes: {}
