repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: nexus-shellcheck
        name: nexus-shellcheck
        entry: ./deploy/scripts/lint-shell.sh
        language: system
        pass_filenames: false
      - id: nexus-shfmt
        name: nexus-shfmt
        entry: shfmt -d -i 2 -ci
        language: system
        files: ^(deploy/scripts/|services/.*/scripts/|services/.*/docker-entrypoint\.sh|quickstart\.sh).+\.sh$
