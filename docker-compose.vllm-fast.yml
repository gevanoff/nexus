services:
  vllm-fast:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    container_name: nexus-vllm-fast
    gpus: all
    ports:
      - "${VLLM_FAST_PORT:-8001}:8000"
    environment:
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NVIDIA_VISIBLE_DEVICES=${VLLM_FAST_CUDA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${VLLM_FAST_CUDA_VISIBLE_DEVICES:-all}
      - NEXUS_VLLM_MODEL=${VLLM_MODEL_FAST:-cyankiwi/Devstral-Small-2507-AWQ-4bit}
      - NEXUS_VLLM_SERVED_MODEL_NAME=${VLLM_FAST_SERVED_MODEL_NAME:-${VLLM_MODEL_FAST:-cyankiwi/Devstral-Small-2507-AWQ-4bit}}
      - NEXUS_VLLM_TOKENIZER=${VLLM_FAST_TOKENIZER:-${VLLM_MODEL_FAST:-cyankiwi/Devstral-Small-2507-AWQ-4bit}}
      - NEXUS_VLLM_TOKENIZER_MODE=${VLLM_FAST_TOKENIZER_MODE:-}
      - NEXUS_VLLM_CONFIG_FORMAT=${VLLM_FAST_CONFIG_FORMAT:-}
      - NEXUS_VLLM_LIMIT_MM_PER_PROMPT=${VLLM_FAST_LIMIT_MM_PER_PROMPT:-}
      - NEXUS_VLLM_SKIP_MM_PROFILING=${VLLM_FAST_SKIP_MM_PROFILING:-false}
      - NEXUS_VLLM_LOAD_FORMAT=${VLLM_FAST_LOAD_FORMAT:-auto}
      - NEXUS_VLLM_TENSOR_PARALLEL_SIZE=${VLLM_FAST_TENSOR_PARALLEL_SIZE:-1}
      - NEXUS_VLLM_GPU_MEMORY_UTILIZATION=${VLLM_FAST_GPU_MEMORY_UTILIZATION:-0.90}
      - NEXUS_VLLM_MAX_MODEL_LEN=${VLLM_FAST_MAX_MODEL_LEN:-32768}
      - NEXUS_VLLM_CPU_OFFLOAD_GB=${VLLM_FAST_CPU_OFFLOAD_GB:-0}
      - NEXUS_VLLM_DTYPE=${VLLM_FAST_DTYPE:-}
      - NEXUS_VLLM_KV_CACHE_DTYPE=${VLLM_FAST_KV_CACHE_DTYPE:-}
      - NEXUS_VLLM_ENFORCE_EAGER=${VLLM_FAST_ENFORCE_EAGER:-false}
      - NEXUS_VLLM_ENABLE_AUTO_TOOL_CHOICE=${VLLM_FAST_ENABLE_AUTO_TOOL_CHOICE:-false}
      - NEXUS_VLLM_TOOL_CALL_PARSER=${VLLM_FAST_TOOL_CALL_PARSER:-}
      - NEXUS_VLLM_TOOL_PARSER_PLUGIN=${VLLM_FAST_TOOL_PARSER_PLUGIN:-}
      - NEXUS_VLLM_EXCLUDE_TOOLS_WHEN_TOOL_CHOICE_NONE=${VLLM_FAST_EXCLUDE_TOOLS_WHEN_TOOL_CHOICE_NONE:-true}
      - NEXUS_VLLM_REASONING_PARSER=${VLLM_FAST_REASONING_PARSER:-}
      - NEXUS_VLLM_CHAT_TEMPLATE=${VLLM_FAST_CHAT_TEMPLATE:-}
      - NEXUS_VLLM_CHAT_TEMPLATE_CONTENT_FORMAT=${VLLM_FAST_CHAT_TEMPLATE_CONTENT_FORMAT:-}
    entrypoint: ["/bin/sh", "/usr/local/bin/nexus-run-vllm-openai"]
    volumes:
      - ./deploy/scripts/run-vllm-openai.sh:/usr/local/bin/nexus-run-vllm-openai:ro
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  vllm-fast-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=${VLLM_FAST_SERVICE_NAME:-vllm-fast}
      - NEXUS_SERVICE_BASE_URL=${VLLM_FAST_ADVERTISE_BASE_URL:-${VLLM_FAST_BASE_URL:-http://vllm-fast:8000/v1}}
      - NEXUS_SERVICE_HEALTH_URL=http://vllm-fast:8000/v1/models
      - NEXUS_SERVICE_BACKEND_CLASS=${VLLM_FAST_BACKEND_CLASS:-local_vllm_fast}
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - vllm-fast
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
