services:
  hunyuan-video:
    build:
      context: ./services/media-generation
      dockerfile: Dockerfile
    container_name: nexus-hunyuan-video
    ports:
      - "${HUNYUAN_VIDEO_PORT:-9185}:9185"
    environment:
      - NEXUS_MEDIA_ENGINE=hunyuan
      - NEXUS_MEDIA_SERVICE_NAME=hunyuan-video
      - NEXUS_MEDIA_MODEL_ID=${HUNYUAN_VIDEO_MODEL_ID:-tencent/HunyuanVideo-1.5}
      - MEDIA_PORT=9185
      - MEDIA_DATA_DIR=/data
      - MEDIA_UPSTREAM_DIR=/data/app
      - MEDIA_OUTPUT_ROOT=/data/outputs
      - MEDIA_PUBLIC_BASE_URL=${HUNYUAN_VIDEO_ADVERTISE_BASE_URL:-}
      - MEDIA_GENERATION_TIMEOUT_SEC=${HUNYUAN_VIDEO_TIMEOUT_SEC:-3600}
      - MEDIA_UPDATE_ON_START=${HUNYUAN_VIDEO_UPDATE_ON_START:-false}
      - HUNYUAN_REPO_URL=${HUNYUAN_REPO_URL:-https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5.git}
      - HUNYUAN_REPO_REF=${HUNYUAN_REPO_REF:-}
      - HUNYUAN_MODEL_PATH=${HUNYUAN_MODEL_PATH:-/data/models/HunyuanVideo-1.5}
      - HUNYUAN_DTYPE=${HUNYUAN_DTYPE:-bf16}
      - HF_HOME=${HUNYUAN_HF_HOME:-${HF_HOME:-/data/huggingface}}
      - HUGGINGFACE_HUB_CACHE=${HUNYUAN_HF_HOME:-${HF_HOME:-/data/huggingface}}/hub
      - TRANSFORMERS_CACHE=${HUNYUAN_HF_HOME:-${HF_HOME:-/data/huggingface}}/transformers
      - XDG_CACHE_HOME=/data/cache
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${HUNYUAN_VIDEO_DATA_BIND_SOURCE:-${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/hunyuan-video}:/data
      - ${HF_HOME_BIND_SOURCE:-/data/huggingface}:${HUNYUAN_HF_HOME:-${HF_HOME:-/data/huggingface}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HUNYUAN_VIDEO_CUDA_VISIBLE_DEVICES:-1}"]
              capabilities: [gpu]
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9185/readyz"]
      interval: 30s
      timeout: 15s
      start_period: 300s
      retries: 5

  hunyuan-video-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=hunyuan-video
      - NEXUS_SERVICE_BASE_URL=${HUNYUAN_VIDEO_ADVERTISE_BASE_URL:-${HUNYUAN_VIDEO_BASE_URL:-http://hunyuan-video:9185}}
      - NEXUS_SERVICE_HEALTH_URL=http://hunyuan-video:9185/readyz
      - NEXUS_SERVICE_BACKEND_CLASS=hunyuan_video
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - hunyuan-video
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
