services:
  # Gateway Service - Central API gateway
  # Shared host paths:
  # - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/data is gateway's RW data dir (SQLite DBs, tool logs, cached UI assets)
  # - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/config is gateway's RO operator config (aliases/specs/tools registry)
  # - ./.env is bind-mounted into the container for parity with macOS launchd layout
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: nexus-gateway
    ports:
      - "${GATEWAY_PORT:-8800}:8800"
      - "${OBSERVABILITY_PORT:-8801}:8801"
    env_file:
      - ./.env
    environment:
      # Server configuration
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8800
      - GATEWAY_BEARER_TOKEN=${GATEWAY_BEARER_TOKEN:?GATEWAY_BEARER_TOKEN must be set in .env}
      - ETCD_ENABLED=${ETCD_ENABLED:-true}
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - ETCD_PREFIX=${ETCD_PREFIX:-/nexus/services/}
      - ETCD_POLL_INTERVAL=${ETCD_POLL_INTERVAL:-15}
      - ETCD_SEED_FROM_ENV=${ETCD_SEED_FROM_ENV:-true}
      - LIFECYCLE_MANAGER_BASE_URL=${LIFECYCLE_MANAGER_BASE_URL:-}
      - LIFECYCLE_MANAGER_TIMEOUT_SEC=${LIFECYCLE_MANAGER_TIMEOUT_SEC:-15}

      # Observability
      - OBSERVABILITY_HOST=0.0.0.0
      - OBSERVABILITY_PORT=8801
      - METRICS_ENABLED=true

      # Upstream services
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_FAST_BASE_URL=${VLLM_FAST_BASE_URL:-http://host.docker.internal:8001/v1}
      - VLLM_EMBEDDINGS_BASE_URL=${VLLM_EMBEDDINGS_BASE_URL:-http://host.docker.internal:8002/v1}
      - VLLM_NATIVE_TOOLS_ENABLED=${VLLM_NATIVE_TOOLS_ENABLED:-false}
      - VLLM_FAST_NATIVE_TOOLS_ENABLED=${VLLM_FAST_NATIVE_TOOLS_ENABLED:-false}
      - MLX_BASE_URL=${MLX_BASE_URL:-}
      - MLX_MIGRAINE_BASE_URL=${MLX_MIGRAINE_BASE_URL:-http://migraine:10241/v1}
      - IMAGES_BACKEND=${IMAGES_BACKEND:-http_openai_images}
      - IMAGES_HTTP_BASE_URL=${IMAGES_HTTP_BASE_URL:-http://images:7860}
      - AUDIO_BACKEND_URL=http://tts:9940

      # Routing configuration
      - DEFAULT_BACKEND=${DEFAULT_BACKEND:-local_mlx}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-local_mlx}
      - ROUTER_ENABLE_POLICY=true

      # Request limits. Keep this above SOCIAL_MEDIA_MAX_BYTES to allow for
      # multipart framing; the default supports video assets up to 1 GiB.
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-1100000000}

      # Data persistence paths (inside container)
      - MEMORY_DB_PATH=/var/lib/gateway/data/memory.sqlite
      - USER_DB_PATH=/var/lib/gateway/data/users.sqlite
      - UI_IMAGE_DIR=/var/lib/gateway/data/ui_images
      - VOICE_LIBRARY_DIR=/var/lib/tts_refs
      - MODEL_ALIASES_PATH=/var/lib/gateway/config/model_aliases.json
      - NEXUS_SOUL_ROOT=${NEXUS_SOUL_ROOT:-/workspace/nexus/souls}
      - NEXUS_SOUL_MAX_CHARS=${NEXUS_SOUL_MAX_CHARS:-12000}
      - MLX_HF_CACHE_DIR=/var/lib/gateway/mlx_hf_cache
      - AGENT_SPECS_PATH=/var/lib/gateway/config/agent_specs.json
      - CODING_WORKSPACE_ROOT=/var/lib/gateway/data/coding/workspaces
      - CODING_TASKS_DIR=/var/lib/gateway/data/coding/tasks
      - CODING_DEFAULT_REPO_URL=${CODING_DEFAULT_REPO_URL:-https://github.com/gevanoff/nexus.git}
      - CODING_ARTIFACT_MAX_BYTES=${CODING_ARTIFACT_MAX_BYTES:-50000000}
      - CODING_ALLOWED_REPOS=${CODING_ALLOWED_REPOS:-https://github.com/gevanoff/nexus.git}
      - CODING_REQUIRE_ADMIN=${CODING_REQUIRE_ADMIN:-true}
      - CODING_SMOKE_REPORT_DIR=/var/lib/gateway/coding_smoke_reports
      - CODING_GIT_TOKEN=${CODING_GIT_TOKEN:-}

      # Tool bus configuration
      - TOOLS_LOG_MODE=ndjson
      - TOOLS_LOG_PATH=/var/lib/gateway/data/tools/invocations.jsonl
      - TOOLS_LOG_DIR=/var/lib/gateway/data/tools
      - TOOLS_SHELL_CWD=/var/lib/gateway/data/tools_work
      - TOOLS_REGISTRY_PATH=/var/lib/gateway/config/tools_registry.json
      - NEXUS_TOOL_EXECUTION_DEFAULT=${NEXUS_TOOL_EXECUTION_DEFAULT:-client_exec}
      - NEXUS_AUTO_INJECT_TOOLS=${NEXUS_AUTO_INJECT_TOOLS:-false}
      - NEXUS_AUTO_INJECT_TOOLSETS=${NEXUS_AUTO_INJECT_TOOLSETS:-core,repo,ops,workspace}
      - NEXUS_CLIENT_TOOL_POLICY=${NEXUS_CLIENT_TOOL_POLICY:-replace}
      - NEXUS_TOOL_MAX_ROUNDS=${NEXUS_TOOL_MAX_ROUNDS:-4}
      - NEXUS_TOOL_MAX_PARALLEL=${NEXUS_TOOL_MAX_PARALLEL:-4}
      - NEXUS_TOOL_TIMEOUT_SEC=${NEXUS_TOOL_TIMEOUT_SEC:-20}
      - NEXUS_TOOL_LOOP_TIMEOUT_SEC=${NEXUS_TOOL_LOOP_TIMEOUT_SEC:-120}
      - NEXUS_TOOL_OUTPUT_MAX_CHARS=${NEXUS_TOOL_OUTPUT_MAX_CHARS:-12000}
      - NEXUS_TOOL_FS_ROOTS=${NEXUS_TOOL_FS_ROOTS:-/workspace/nexus,/var/lib/gateway/app,/var/lib/gateway/config}
      - NEXUS_UI_GATEWAY_EXEC=${NEXUS_UI_GATEWAY_EXEC:-false}

      # Memory v2
      - MEMORY_V2_ENABLED=true
    volumes:
      - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/data:/var/lib/gateway/data
      - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/tts_refs:/var/lib/tts_refs
      - ${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/config:/var/lib/gateway/config:ro
      - ${MLX_HF_CACHE_HOST_DIR:-${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/mlx_hf_cache}:/var/lib/gateway/mlx_hf_cache:ro
      - ${NEXUS_CODING_SMOKE_OUTPUT_DIR:-${NEXUS_RUNTIME_ROOT:-/ai-data/runtime}/gateway/data/coding-smoke/reports}:/var/lib/gateway/coding_smoke_reports
      - type: bind
        source: ${GATEWAY_ENV_FILE:-./.env}
        target: /var/lib/gateway/app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: .
        target: /workspace/nexus
        read_only: true
    extra_hosts:
      - "stackrot:${NEXUS_HOST_STACKROT_IP}"
      - "stackrot.embrient.com:${NEXUS_HOST_STACKROT_IP}"
      - "ai2:${NEXUS_HOST_AI2_IP}"
      - "ai2.embrient.com:${NEXUS_HOST_AI2_IP}"
      - "migraine:${NEXUS_HOST_MIGRAINE_IP}"
      - "migraine.embrient.com:${NEXUS_HOST_MIGRAINE_IP}"
      - "ada2:${NEXUS_HOST_ADA2_IP}"
      - "ada2.embrient.com:${NEXUS_HOST_ADA2_IP}"
      - "meltdown:${NEXUS_HOST_MELTDOWN_IP}"
      - "meltdown.embrient.com:${NEXUS_HOST_MELTDOWN_IP}"
      - "adada:${NEXUS_HOST_ADADA_IP}"
      - "adada.embrient.com:${NEXUS_HOST_ADADA_IP}"
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
