services:
  vllm-embeddings:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    container_name: nexus-vllm-embeddings
    gpus: all
    ports:
      - "${VLLM_EMBEDDINGS_PORT:-8002}:8000"
    environment:
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NVIDIA_VISIBLE_DEVICES=${VLLM_EMBEDDINGS_CUDA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${VLLM_EMBEDDINGS_CUDA_VISIBLE_DEVICES:-all}
      - NEXUS_VLLM_MODEL=${VLLM_MODEL_EMBEDDINGS:-unsloth/Qwen3-Embedding-4B}
      - NEXUS_VLLM_SERVED_MODEL_NAME=${VLLM_EMBEDDINGS_SERVED_MODEL_NAME:-${VLLM_MODEL_EMBEDDINGS:-unsloth/Qwen3-Embedding-4B}}
      - NEXUS_VLLM_TOKENIZER=${VLLM_EMBEDDINGS_TOKENIZER:-${VLLM_MODEL_EMBEDDINGS:-unsloth/Qwen3-Embedding-4B}}
      - NEXUS_VLLM_LOAD_FORMAT=${VLLM_EMBEDDINGS_LOAD_FORMAT:-auto}
      - NEXUS_VLLM_TENSOR_PARALLEL_SIZE=${VLLM_EMBEDDINGS_TENSOR_PARALLEL_SIZE:-1}
      - NEXUS_VLLM_GPU_MEMORY_UTILIZATION=${VLLM_EMBEDDINGS_GPU_MEMORY_UTILIZATION:-0.90}
      - NEXUS_VLLM_MAX_MODEL_LEN=${VLLM_EMBEDDINGS_MAX_MODEL_LEN:-2048}
      - NEXUS_VLLM_CPU_OFFLOAD_GB=${VLLM_EMBEDDINGS_CPU_OFFLOAD_GB:-0}
      - NEXUS_VLLM_DTYPE=${VLLM_EMBEDDINGS_DTYPE:-}
      - NEXUS_VLLM_KV_CACHE_DTYPE=${VLLM_EMBEDDINGS_KV_CACHE_DTYPE:-}
      - NEXUS_VLLM_ENFORCE_EAGER=${VLLM_EMBEDDINGS_ENFORCE_EAGER:-false}
      - NEXUS_VLLM_ENABLE_AUTO_TOOL_CHOICE=false
    entrypoint: ["/bin/sh", "/usr/local/bin/nexus-run-vllm-openai"]
    volumes:
      - ./deploy/scripts/run-vllm-openai.sh:/usr/local/bin/nexus-run-vllm-openai:ro
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${VLLM_EMBEDDINGS_HEALTHCHECK_START_PERIOD:-90s}

  vllm-embeddings-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=${VLLM_EMBEDDINGS_SERVICE_NAME:-vllm-embeddings}
      - NEXUS_SERVICE_BASE_URL=${VLLM_EMBEDDINGS_ADVERTISE_BASE_URL:-${VLLM_EMBEDDINGS_BASE_URL:-http://vllm-embeddings:8000/v1}}
      - NEXUS_SERVICE_HEALTH_URL=http://vllm-embeddings:8000/v1/models
      - NEXUS_SERVICE_BACKEND_CLASS=${VLLM_EMBEDDINGS_BACKEND_CLASS:-local_vllm_embeddings}
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - vllm-embeddings
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
