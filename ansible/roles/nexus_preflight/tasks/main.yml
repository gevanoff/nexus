- name: Run Nexus deploy preflight checks
  ansible.builtin.command:
    argv: "{{ ['/bin/bash', './deploy/scripts/preflight-check.sh', '--mode', 'deploy', '--env-file', nexus_env_file, '--components', (nexus_components | join(','))] }}"
  args:
    chdir: "{{ nexus_repo_dir }}"
  changed_when: false
  when: (nexus_components | default([]) | length) > 0

- name: Skip deploy preflight for componentless infrastructure hosts
  ansible.builtin.debug:
    msg: "No Nexus service components are assigned to {{ nexus_topology_host }}; skipping deploy preflight."
  when: (nexus_components | default([]) | length) == 0
