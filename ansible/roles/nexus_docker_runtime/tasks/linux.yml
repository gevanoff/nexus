- name: Probe for an existing Docker CLI on Linux
  ansible.builtin.raw: "command -v docker || true"
  register: nexus_linux_docker_cli_probe
  changed_when: false
  check_mode: false
  when: nexus_manage_docker_runtime | bool

- name: Probe for Docker Compose availability on Linux
  ansible.builtin.raw: |
    if docker compose version >/dev/null 2>&1 || docker-compose version >/dev/null 2>&1; then
      echo present
    fi
  register: nexus_linux_docker_compose_probe
  changed_when: false
  check_mode: false
  when: nexus_manage_docker_runtime | bool

- name: Probe for a Docker service definition on Linux
  ansible.builtin.raw: |
    if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files docker.service >/dev/null 2>&1; then
      echo present
      exit 0
    fi
    if [ -f /etc/init.d/docker ]; then
      echo present
    fi
  register: nexus_linux_docker_service_probe
  changed_when: false
  check_mode: false
  when: nexus_manage_docker_runtime | bool

- name: Probe for the docker group on Linux
  ansible.builtin.raw: |
    if command -v getent >/dev/null 2>&1 && getent group docker >/dev/null 2>&1; then
      echo present
    fi
  register: nexus_linux_docker_group_probe
  changed_when: false
  check_mode: false
  when: nexus_manage_docker_runtime | bool

- name: Configure official Docker apt repository on Debian-family Linux
  ansible.builtin.shell: |
    set -euo pipefail
    if [[ "{{ ansible_distribution | lower }}" == "ubuntu" ]]; then
      repo_os="ubuntu"
    elif [[ "{{ ansible_distribution | lower }}" == "debian" ]]; then
      repo_os="debian"
    else
      echo "Unsupported Debian-family distribution for official Docker packages: {{ ansible_distribution }}" >&2
      exit 1
    fi
    case "{{ ansible_architecture }}" in
      x86_64) repo_arch="amd64" ;;
      aarch64|arm64) repo_arch="arm64" ;;
      armv7l) repo_arch="armhf" ;;
      *) repo_arch="{{ ansible_architecture }}" ;;
    esac
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL "https://download.docker.com/linux/${repo_os}/gpg" -o /etc/apt/keyrings/docker.asc.tmp
    chmod a+r /etc/apt/keyrings/docker.asc.tmp
    mv /etc/apt/keyrings/docker.asc.tmp /etc/apt/keyrings/docker.asc
    desired="deb [arch=${repo_arch} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${repo_os} {{ ansible_distribution_release }} stable"
    current="$(cat /etc/apt/sources.list.d/docker.list 2>/dev/null || true)"
    if [[ "$current" != "$desired" ]]; then
      printf '%s\n' "$desired" > /etc/apt/sources.list.d/docker.list
      echo changed
    fi
    apt-get update
  args:
    executable: /bin/bash
  become: true
  register: nexus_linux_docker_official_apt_repo
  changed_when: "'changed' in nexus_linux_docker_official_apt_repo.stdout"
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_linux_docker_official_apt_enabled | bool
    - ansible_os_family == "Debian"
    - (nexus_linux_docker_cli_probe.stdout | trim) == ""

- name: Install official Docker engine packages on Debian-family Linux
  ansible.builtin.apt:
    name: "{{ nexus_linux_docker_official_apt_packages }}"
    state: present
    update_cache: false
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_linux_docker_official_apt_enabled | bool
    - ansible_os_family == "Debian"
    - (nexus_linux_docker_cli_probe.stdout | trim) == ""

- name: Install Docker engine packages on Linux from distro repositories
  ansible.builtin.package:
    name: "{{ nexus_linux_docker_engine_packages.get(ansible_os_family, nexus_linux_docker_engine_packages.get('Debian', [])) }}"
    state: present
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - not (nexus_linux_docker_official_apt_enabled | bool and ansible_os_family == "Debian")
    - (nexus_linux_docker_cli_probe.stdout | trim) == ""

- name: Ensure Docker Compose is available on Linux
  ansible.builtin.shell: |
    set -euo pipefail
    if docker compose version >/dev/null 2>&1 || docker-compose version >/dev/null 2>&1; then
      exit 0
    fi
    if command -v apt-get >/dev/null 2>&1; then
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y docker-compose-plugin || apt-get install -y docker-compose
      exit 0
    fi
    if command -v dnf >/dev/null 2>&1; then
      dnf install -y docker-compose-plugin || dnf install -y docker-compose
      exit 0
    fi
    if command -v yum >/dev/null 2>&1; then
      yum install -y docker-compose-plugin || yum install -y docker-compose
      exit 0
    fi
    if command -v zypper >/dev/null 2>&1; then
      zypper --non-interactive install docker-compose
      exit 0
    fi
    echo "Unable to install Docker Compose on this host" >&2
    exit 1
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - nexus_manage_docker_runtime | bool
    - (nexus_linux_docker_compose_probe.stdout | trim) == ""

- name: Ensure the Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - not ansible_check_mode or (nexus_linux_docker_service_probe.stdout | trim) != ""

- name: Probe for NVIDIA GPU availability on Linux
  ansible.builtin.raw: |
    if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
      echo present
    fi
  register: nexus_linux_nvidia_gpu_probe
  changed_when: false
  check_mode: false
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - (nexus_resource_kind | default('')) == "linux_nvidia"

- name: Probe for NVIDIA Container Toolkit on Linux
  ansible.builtin.raw: |
    if command -v nvidia-ctk >/dev/null 2>&1 || command -v nvidia-container-cli >/dev/null 2>&1; then
      echo present
    fi
  register: nexus_linux_nvidia_container_toolkit_probe
  changed_when: false
  check_mode: false
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"

- name: Install NVIDIA Container Toolkit on apt-based Linux GPU hosts
  ansible.builtin.shell: |
    set -euo pipefail
    if ! command -v apt-get >/dev/null 2>&1; then
      echo "Automatic NVIDIA Container Toolkit install currently supports apt-based Linux hosts only." >&2
      exit 1
    fi
    if [[ ! -r /etc/os-release ]]; then
      echo "Cannot read /etc/os-release; unable to detect NVIDIA Container Toolkit repository." >&2
      exit 1
    fi
    . /etc/os-release
    distribution="${ID}${VERSION_ID}"
    install -d -m 0755 /usr/share/keyrings
    rm -f /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg.tmp
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg.tmp
    mv /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg.tmp /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -fsSL "https://nvidia.github.io/libnvidia-container/${distribution}/libnvidia-container.list" \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
    apt-get update
    apt-get install -y nvidia-container-toolkit
  args:
    executable: /bin/bash
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - not ansible_check_mode
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"
    - (nexus_linux_nvidia_container_toolkit_probe.stdout | default('') | trim) == ""

- name: Probe Docker NVIDIA runtime configuration
  ansible.builtin.raw: |
    if docker info --format '{{ "{{json .Runtimes}}" }}' 2>/dev/null | grep -q '"nvidia"'; then
      echo present
      exit 0
    fi
    if [ -f /etc/docker/daemon.json ] && grep -q '"nvidia"' /etc/docker/daemon.json; then
      echo present
    fi
  register: nexus_linux_docker_nvidia_runtime_probe
  changed_when: false
  check_mode: false
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"

- name: Configure Docker to use NVIDIA Container Toolkit
  ansible.builtin.shell: |
    set -euo pipefail
    nvidia-ctk runtime configure --runtime=docker
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - not ansible_check_mode
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"
    - (nexus_linux_docker_nvidia_runtime_probe.stdout | default('') | trim) == ""

- name: Restart Docker after NVIDIA runtime configuration
  ansible.builtin.service:
    name: docker
    state: restarted
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - not ansible_check_mode
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"
    - (nexus_linux_docker_nvidia_runtime_probe.stdout | default('') | trim) == ""

- name: Optionally validate NVIDIA runtime with a CUDA container
  ansible.builtin.shell: |
    set -euo pipefail
    docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - nexus_manage_docker_runtime | bool
    - nexus_manage_nvidia_container_runtime | bool
    - nexus_nvidia_container_runtime_validate | bool
    - not ansible_check_mode
    - (nexus_resource_kind | default('')) == "linux_nvidia"
    - (nexus_linux_nvidia_gpu_probe.stdout | default('') | trim) == "present"

- name: Ensure the runtime user is in the docker group
  ansible.builtin.user:
    name: "{{ nexus_runtime_user }}"
    groups: docker
    append: true
  become: true
  when:
    - nexus_manage_docker_runtime | bool
    - not ansible_check_mode or (nexus_linux_docker_group_probe.stdout | trim) != ""
