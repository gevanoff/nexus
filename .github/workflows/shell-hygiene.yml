name: Shell Hygiene

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  shell-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Collect changed shell files
        id: changed-shell
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
            diff_output="$(git diff --name-only --diff-filter=ACMR "$base_ref"...HEAD)"
          else
            before_sha="${{ github.event.before }}"
            if [[ -z "$before_sha" || "$before_sha" == "0000000000000000000000000000000000000000" ]]; then
              diff_output="$(git ls-files)"
            else
              diff_output="$(git diff --name-only --diff-filter=ACMR "$before_sha" HEAD)"
            fi
          fi

          shell_files="$(printf '%s\n' "$diff_output" | grep -E '^(quickstart\.sh|deploy/scripts/.*\.sh|services/.*/scripts/.*\.sh|services/.*/docker-entrypoint\.sh)$' || true)"
          {
            echo 'files<<EOF'
            printf '%s\n' "$shell_files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run shell syntax and ShellCheck
        id: shell-lint
        if: steps.changed-shell.outputs.files != ''
        continue-on-error: true
        shell: bash
        run: |
          chmod +x ./deploy/scripts/lint-shell.sh
          mapfile -t files < <(printf '%s\n' '${{ steps.changed-shell.outputs.files }}' | sed '/^$/d')
          ./deploy/scripts/lint-shell.sh --skip-format "${files[@]}" >shell-hygiene.log 2>&1

      - name: Upload Shell Hygiene diagnostics
        if: always() && steps.changed-shell.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: shell-hygiene-${{ github.run_id }}
          path: shell-hygiene.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail on Shell Hygiene errors
        if: steps.shell-lint.outcome == 'failure'
        shell: bash
        run: |
          cat shell-hygiene.log
          exit 1
