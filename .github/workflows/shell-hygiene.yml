name: Shell Hygiene

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  shell-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shell lint
        run: |
          chmod +x ./deploy/scripts/lint-shell.sh
          ./deploy/scripts/lint-shell.sh