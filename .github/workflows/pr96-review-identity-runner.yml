name: PR96 review identity patch runner

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - name: Apply review identity patch
        run: python .github/scripts/pr96_review_identity_patch.py
      - name: Install Gateway test dependencies
        run: python -m pip install --quiet -r services/gateway/app/requirements.freeze.txt -r services/gateway/tests/requirements.freeze.txt
      - name: Run focused acceptance tests
        env:
          GATEWAY_BEARER_TOKEN: test-token
          PYTHONPATH: services/gateway
        run: |
          python -m pytest -q \
            services/gateway/tests/test_coding_mission_acceptance_epoch_review_binding.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_integrity.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_cas.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_retry.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_post_record_race.py \
            services/gateway/tests/test_coding_command_mutation_acceptance.py
      - name: Commit review identity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/gateway/app/coding_agent_guarded.py \
                  services/gateway/app/coding_mission_acceptance_epoch.py \
                  services/gateway/app/coding_semantic_acceptance_contract.py \
                  services/gateway/tests/test_coding_mission_acceptance_epoch.py \
                  services/gateway/tests/test_coding_mission_acceptance_epoch_review_binding.py \
                  services/gateway/tests/test_coding_semantic_acceptance_contract_integrity.py
          git diff --cached --check
          git commit -m 'Bind acceptance publication to invoking finish review'
          git push origin HEAD:agent/semantic-acceptance-contract
