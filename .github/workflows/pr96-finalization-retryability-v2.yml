name: PR96 resumable finalization guard repair v2

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply resumable finalization patch and migrate assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr96-finalization-retryability.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, 'pr96-finalization-retryability-transfer', 'exec'))

          test = Path('services/gateway/tests/test_coding_mission_acceptance_epoch.py')
          text = test.read_text()
          anchor = 'def test_finalizer_load_failure_cannot_reach_original_finalizer():'
          pos = text.index(anchor)
          head, tail = text[:pos], text[pos:]
          old = '    assert result["required_action"].startswith("Retry coding_finish")\n'
          new = '    assert "retry coding_finish" in result["required_action"].lower()\n'
          if old not in tail:
              raise SystemExit('stale finalizer required-action assertion not found')
          tail = tail.replace(old, new, 1)
          test.write_text(head + tail)
          PY
          python -m py_compile \
            services/gateway/app/coding_mission_acceptance_epoch.py \
            services/gateway/app/coding_agent.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_finalization.py
          git diff --check
      - name: Install Gateway test dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
      - name: Prepare writable Gateway runtime paths
        shell: bash
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus
      - name: Run focused finalization lifecycle tests
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_finalization.py \
            services/gateway/tests/test_coding_resume_convergence_hardening.py
      - name: Run full Gateway suite
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: python -m pytest -q --tb=short services/gateway/tests
      - name: Commit clean fix
        shell: bash
        run: |
          git rm -f \
            .github/workflows/pr96-finalization-retryability.yml \
            .github/workflows/pr96-finalization-retryability-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/gateway/app/coding_mission_acceptance_epoch.py \
            services/gateway/app/coding_agent.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_finalization.py
          git commit -m "Keep guarded finalization resumable"
          git push origin HEAD:agent/semantic-acceptance-contract