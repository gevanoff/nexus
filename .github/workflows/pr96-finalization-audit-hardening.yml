name: PR96 finalization audit hardening

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply finalization readiness and audit patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          epoch = Path('services/gateway/app/coding_mission_acceptance_epoch.py')
          text = epoch.read_text()

          old = '''            if state.get("has_delta") and not accepted:\n                return resumable_guard_failure(\n                    error="mission_semantic_acceptance_missing",\n                    required_action="Resume the run and retry coding_finish to obtain semantic acceptance for the current mission delta.",\n                    summary=(\n                        "The workspace contains a mission delta without current semantic acceptance. "\n                        "Finalization was interrupted before commit or push and may be resumed."\n                    ),\n                )\n            if state.get("has_delta") and accepted and _snapshot_ready(snapshot):\n                contract = cw.normalize_coding_mission(task, mission)\n'''
          new = '''            if state.get("has_delta") and not accepted:\n                return resumable_guard_failure(\n                    error="mission_semantic_acceptance_missing",\n                    required_action="Resume the run and retry coding_finish to obtain semantic acceptance for the current mission delta.",\n                    summary=(\n                        "The workspace contains a mission delta without current semantic acceptance. "\n                        "Finalization was interrupted before commit or push and may be resumed."\n                    ),\n                )\n            if state.get("has_delta") and accepted and not _snapshot_ready(snapshot):\n                return resumable_guard_failure(\n                    error="mission_finalization_readiness_stale",\n                    required_action=(\n                        "Resume the run, restore current validation and diff-review readiness, "\n                        "then retry coding_finish."\n                    ),\n                    summary=(\n                        "The current mission delta is semantically accepted, but its validation or "\n                        "diff-review readiness is no longer current. Finalization was interrupted "\n                        "before repository side effects and may be resumed."\n                    ),\n                )\n            if state.get("has_delta") and accepted and _snapshot_ready(snapshot):\n                accepted_epoch = _mapping(task.get(KEY))\n                accepted_fingerprint = str(accepted_epoch.get("accepted_fingerprint") or "").strip()\n                accepted_generation = _int(accepted_epoch.get("acceptance_publication_generation"))\n                contract = cw.normalize_coding_mission(task, mission)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'readiness marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                if result.get("ok") is True:\n                    now = time.time()\n                    final_head = str(state.get("current_head") or "")\n\n                    def apply(latest: Dict[str, Any]) -> None:\n                        current = dict(_mapping(latest.get(KEY)))\n                        if current.get("accepted_fingerprint"):\n                            current.update(\n                                {\n                                    "status": "finalized",\n                                    "finalized_at": now,\n                                    "finalized_head": final_head,\n                                    "updated_at": now,\n                                }\n                            )\n                            latest[KEY] = current\n'''
          new = '''                if result.get("ok") is True:\n                    now = time.time()\n                    final_head = str(\n                        result.get("final_commit") or state.get("current_head") or ""\n                    ).strip()\n\n                    def apply(latest: Dict[str, Any]) -> None:\n                        current = dict(_mapping(latest.get(KEY)))\n                        if (\n                            str(current.get("accepted_fingerprint") or "").strip()\n                            != accepted_fingerprint\n                            or _int(current.get("acceptance_publication_generation"))\n                            != accepted_generation\n                        ):\n                            return\n                        current.update(\n                            {\n                                "status": "finalized",\n                                "finalized_at": now,\n                                "finalized_head": final_head,\n                                "updated_at": now,\n                            }\n                        )\n                        latest[KEY] = current\n'''
          if text.count(old) != 1:
              raise SystemExit(f'finalized-head marker count={text.count(old)}')
          epoch.write_text(text.replace(old, new, 1))

          test = Path('services/gateway/tests/test_coding_mission_acceptance_epoch.py')
          t = test.read_text()
          marker = '''\ndef test_finalizer_invalid_delta_state_is_resumable_interruption(monkeypatch):\n'''
          insertion = '''\ndef test_finalizer_stale_readiness_is_resumable_interruption():\n    cw = _CW()\n    agent = _Agent(cw)\n    guarded = _Guarded(agent, cw)\n    epoch.install(agent, guarded, cw, _ForcedAction(), _TerminalHardening())\n\n    finish = guarded._run_tool_with_semantic_acceptance(\n        "code-test", "coding_finish", {}, git_token_value=None\n    )\n    assert finish["ok"] is True\n    assert (cw.task.get(epoch.KEY) or {}).get("accepted_fingerprint")\n\n    cw.snapshot["validation"] = {\n        **dict(cw.snapshot["validation"]),\n        "validation_after_latest_edit": False,\n    }\n    result = agent.finalize_successful_run(\n        "code-test", mission=cw.task["coding_mission"], run_id="run-b"\n    )\n\n    assert result["ok"] is False\n    assert result["error"] == "mission_finalization_readiness_stale"\n    assert result["finalization_status"] == "interrupted"\n    assert result["stop_reason_code"] == "run_interrupted"\n    assert result["retryable"] is True\n    assert cw.task["finalization_status"] == "interrupted"\n    assert agent.finalize_calls == []\n\n\ndef test_finalized_epoch_uses_post_commit_head_and_exact_publication_identity():\n    cw = _CW()\n    agent = _Agent(cw)\n\n    def post_commit_finalizer(task_id, *, mission=None, **kwargs):\n        agent.finalize_calls.append((task_id, mission, kwargs))\n        cw.current_head = "post-commit-head"\n        return {"ok": True, "final_commit": "post-commit-head"}\n\n    agent.finalize_successful_run = post_commit_finalizer\n    guarded = _Guarded(agent, cw)\n    epoch.install(agent, guarded, cw, _ForcedAction(), _TerminalHardening())\n\n    finish = guarded._run_tool_with_semantic_acceptance(\n        "code-test", "coding_finish", {}, git_token_value=None\n    )\n    assert finish["ok"] is True\n    before = dict(cw.task[epoch.KEY])\n    assert before["status"] == "semantic_accepted"\n\n    result = agent.finalize_successful_run(\n        "code-test", mission=cw.task["coding_mission"], run_id="run-b"\n    )\n\n    assert result["ok"] is True\n    finalized = cw.task[epoch.KEY]\n    assert finalized["status"] == "finalized"\n    assert finalized["finalized_head"] == "post-commit-head"\n    assert finalized["accepted_fingerprint"] == before["accepted_fingerprint"]\n    assert (\n        finalized["acceptance_publication_generation"]\n        == before["acceptance_publication_generation"]\n    )\n\n\ndef test_finalizer_does_not_mark_replaced_acceptance_as_its_own_finalization():\n    cw = _CW()\n    agent = _Agent(cw)\n\n    def replacing_finalizer(task_id, *, mission=None, **kwargs):\n        agent.finalize_calls.append((task_id, mission, kwargs))\n        current = dict(cw.task[epoch.KEY])\n        current.update(\n            {\n                "accepted_fingerprint": "concurrent-publication",\n                "acceptance_publication_generation": int(\n                    current.get("acceptance_publication_generation") or 0\n                ) + 1,\n                "status": "semantic_accepted",\n            }\n        )\n        cw.task[epoch.KEY] = current\n        return {"ok": True, "final_commit": "post-commit-head"}\n\n    agent.finalize_successful_run = replacing_finalizer\n    guarded = _Guarded(agent, cw)\n    epoch.install(agent, guarded, cw, _ForcedAction(), _TerminalHardening())\n\n    finish = guarded._run_tool_with_semantic_acceptance(\n        "code-test", "coding_finish", {}, git_token_value=None\n    )\n    assert finish["ok"] is True\n    result = agent.finalize_successful_run(\n        "code-test", mission=cw.task["coding_mission"], run_id="run-b"\n    )\n\n    assert result["ok"] is True\n    current = cw.task[epoch.KEY]\n    assert current["status"] == "semantic_accepted"\n    assert current["accepted_fingerprint"] == "concurrent-publication"\n    assert not current.get("finalized_at")\n\n'''
          if t.count(marker) != 1:
              raise SystemExit(f'test insertion marker count={t.count(marker)}')
          test.write_text(t.replace(marker, insertion + marker, 1))
          PY
          python -m py_compile \
            services/gateway/app/coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py
          git diff --check
      - name: Install Gateway test dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
      - name: Prepare writable Gateway runtime paths
        shell: bash
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus
      - name: Run focused finalization tests
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_finalization.py \
            services/gateway/tests/test_coding_terminal_acceptance_hardening.py
      - name: Run full Gateway suite
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: python -m pytest -q --tb=short services/gateway/tests
      - name: Commit clean fix
        shell: bash
        run: |
          git rm -f .github/workflows/pr96-finalization-audit-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/gateway/app/coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py
          git commit -m "Harden finalization readiness and audit identity"
          git push origin HEAD:agent/semantic-acceptance-contract