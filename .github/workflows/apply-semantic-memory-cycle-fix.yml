name: Apply semantic-memory cycle-boundary fix

on:
  push:
    branches:
      - agent/fix-semantic-memory-cycle-race

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-semantic-memory-cycle-race

      - name: Apply deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_path = Path("services/gateway/app/coding_agent.py")
          agent = agent_path.read_text(encoding="utf-8")

          old_import = "from app import coding_model_policy\nfrom app import coding_workspace as cw\n"
          new_import = "from app import coding_model_policy\nfrom app import coding_semantic_memory\nfrom app import coding_workspace as cw\n"
          if old_import not in agent:
              raise SystemExit("coding_agent import anchor not found")
          agent = agent.replace(old_import, new_import, 1)

          helper_anchor = '''async def request_stop(task_id: str) -> Dict[str, Any]:
              return await request_pause(task_id)


          async def _run_agent(
          '''
          helper_replacement = '''async def request_stop(task_id: str) -> Dict[str, Any]:
              return await request_pause(task_id)


          async def _enforce_cycle_progress_decision(
              task_id: str,
              *,
              cycle: int,
              decision: ProgressDecision,
          ) -> None:
              checkpoint_injected = False
              try:
                  checkpoint_injected = bool(
                      await asyncio.to_thread(coding_semantic_memory.process_task, task_id)
                  )
              except Exception as exc:
                  logger.warning(
                      "coding semantic checkpoint failed task_id=%s cycle=%s (%s: %s)",
                      task_id,
                      cycle,
                      type(exc).__name__,
                      exc,
                  )
                  await asyncio.to_thread(
                      _append_event,
                      task_id,
                      {
                          "type": "investigation_checkpoint_error",
                          "cycle": cycle,
                          "summary": f"{type(exc).__name__}: {exc}",
                      },
                  )

              if checkpoint_injected and decision.pause:
                  await asyncio.to_thread(
                      _append_event,
                      task_id,
                      {
                          "type": "no_progress_recovery",
                          "cycle": cycle,
                          "stagnant_cycles": decision.state.stagnant_cycles,
                          "summary": (
                              "A durable investigation checkpoint was injected at the no-progress boundary. "
                              "Granting one recovery cycle so the model can act on the required next action."
                          ),
                      },
                  )
                  return

              if not decision.pause:
                  return

              await asyncio.to_thread(
                  _append_event,
                  task_id,
                  {
                      "type": "no_progress_limit",
                      "cycle": cycle,
                      "reason_code": decision.reason_code,
                      "summary": decision.summary,
                      "stagnant_cycles": decision.state.stagnant_cycles,
                  },
              )
              raise _CodingAgentPaused(
                  decision.summary,
                  reason_code=decision.reason_code,
                  details={
                      "cycle": cycle,
                      "stagnant_cycles": decision.state.stagnant_cycles,
                  },
              )


          async def _run_agent(
          '''
          if helper_anchor not in agent:
              raise SystemExit("coding_agent helper anchor not found")
          agent = agent.replace(helper_anchor, helper_replacement, 1)

          old_pause = '''            if decision.pause:
                          await asyncio.to_thread(
                              _append_event,
                              task_id,
                              {
                                  "type": "no_progress_limit",
                                  "cycle": cycle,
                                  "reason_code": decision.reason_code,
                                  "summary": decision.summary,
                                  "stagnant_cycles": decision.state.stagnant_cycles,
                              },
                          )
                          raise _CodingAgentPaused(
                              decision.summary,
                              reason_code=decision.reason_code,
                              details={
                                  "cycle": cycle,
                                  "stagnant_cycles": decision.state.stagnant_cycles,
                              },
                          )
          '''
          new_pause = '''            await _enforce_cycle_progress_decision(
                          task_id,
                          cycle=cycle,
                          decision=decision,
                      )
          '''
          if old_pause not in agent:
              raise SystemExit("coding_agent pause block not found")
          agent = agent.replace(old_pause, new_pause, 1)
          agent_path.write_text(agent, encoding="utf-8")

          test_path = Path("services/gateway/tests/test_coding_semantic_memory.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test_import = "import asyncio\n\nimport pytest\n"
          new_test_import = "import asyncio\nfrom types import SimpleNamespace\n\nimport pytest\n"
          if old_test_import not in tests:
              raise SystemExit("semantic-memory test import anchor not found")
          tests = tests.replace(old_test_import, new_test_import, 1)

          test_anchor = '''def test_inactive_workspace_is_ignored(monkeypatch):
              task = _task()
              task["agent_status"] = "paused"
              messages = _install_workspace_stubs(monkeypatch, task)

              assert memory.process_task(task["id"]) is False
              assert messages == []


          @pytest.mark.asyncio
          async def test_runtime_start_and_stop_are_idempotent(monkeypatch):
          '''
          test_replacement = '''def test_inactive_workspace_is_ignored(monkeypatch):
              task = _task()
              task["agent_status"] = "paused"
              messages = _install_workspace_stubs(monkeypatch, task)

              assert memory.process_task(task["id"]) is False
              assert messages == []


          @pytest.mark.asyncio
          async def test_cycle_boundary_checkpoint_recovers_before_terminal_pause(monkeypatch):
              calls = []
              decision = SimpleNamespace(
                  pause=True,
                  reason_code="no_progress_limit",
                  summary="paused",
                  state=SimpleNamespace(stagnant_cycles=8),
              )
              monkeypatch.setattr(
                  coding_agent.coding_semantic_memory,
                  "process_task",
                  lambda task_id: calls.append(("checkpoint", task_id)) or True,
              )
              monkeypatch.setattr(
                  coding_agent,
                  "_append_event",
                  lambda task_id, event: calls.append(("event", event["type"])) or event,
              )

              await coding_agent._enforce_cycle_progress_decision(
                  "code_abcdef123456",
                  cycle=8,
                  decision=decision,
              )

              assert calls == [
                  ("checkpoint", "code_abcdef123456"),
                  ("event", "no_progress_recovery"),
              ]


          @pytest.mark.asyncio
          async def test_cycle_boundary_pauses_after_checkpoint_credit_is_used(monkeypatch):
              calls = []
              decision = SimpleNamespace(
                  pause=True,
                  reason_code="no_progress_limit",
                  summary="paused",
                  state=SimpleNamespace(stagnant_cycles=8),
              )
              monkeypatch.setattr(
                  coding_agent.coding_semantic_memory,
                  "process_task",
                  lambda task_id: calls.append(("checkpoint", task_id)) or False,
              )
              monkeypatch.setattr(
                  coding_agent,
                  "_append_event",
                  lambda task_id, event: calls.append(("event", event["type"])) or event,
              )

              with pytest.raises(coding_agent._CodingAgentPaused) as exc_info:
                  await coding_agent._enforce_cycle_progress_decision(
                      "code_abcdef123456",
                      cycle=8,
                      decision=decision,
                  )

              assert exc_info.value.reason_code == "no_progress_limit"
              assert calls == [
                  ("checkpoint", "code_abcdef123456"),
                  ("event", "no_progress_limit"),
              ]


          @pytest.mark.asyncio
          async def test_runtime_start_and_stop_are_idempotent(monkeypatch):
          '''
          if test_anchor not in tests:
              raise SystemExit("semantic-memory test insertion anchor not found")
          tests = tests.replace(test_anchor, test_replacement, 1)
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/apply-semantic-memory-cycle-fix.yml").unlink()
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/app/requirements.tests.freeze.txt
          python -m py_compile \
            services/gateway/app/coding_agent.py \
            services/gateway/app/coding_semantic_memory.py
          cd services/gateway
          PYTHONPATH=. python -m pytest -q \
            tests/test_coding_semantic_memory.py \
            tests/test_coding_runtime_guardrails.py

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce semantic checkpoints at coding cycle boundaries"
          git push origin HEAD:agent/fix-semantic-memory-cycle-race
