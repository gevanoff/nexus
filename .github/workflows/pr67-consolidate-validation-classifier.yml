name: PR67 Consolidate Validation Classifier

on:
  push:
    branches:
      - agent/evidence-qualified-code-reviews

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/evidence-qualified-code-reviews
          fetch-depth: 0
          persist-credentials: true

      - name: Consolidate validation classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          phases_path = Path("services/gateway/app/coding_work_phases.py")
          phases = phases_path.read_text(encoding="utf-8")

          phases = phases.replace(
              '_UV_RUN_SHORT_OPTIONS_WITH_VALUES = {"-c", "-C", "-f", "-p"}\n',
              '_UV_RUN_SHORT_OPTIONS_WITH_VALUES = {"-c", "-C", "-f", "-p"}\n'
              '_UV_RUN_LONG_FLAG_OPTIONS = {\n'
              '    "--active",\n'
              '    "--all-extras",\n'
              '    "--all-groups",\n'
              '    "--compile-bytecode",\n'
              '    "--exact",\n'
              '    "--frozen",\n'
              '    "--inexact",\n'
              '    "--isolated",\n'
              '    "--locked",\n'
              '    "--managed-python",\n'
              '    "--native-tls",\n'
              '    "--no-cache",\n'
              '    "--no-compile-bytecode",\n'
              '    "--no-config",\n'
              '    "--no-default-groups",\n'
              '    "--no-dev",\n'
              '    "--no-editable",\n'
              '    "--no-managed-python",\n'
              '    "--no-progress",\n'
              '    "--no-project",\n'
              '    "--no-python-downloads",\n'
              '    "--no-sources",\n'
              '    "--no-sync",\n'
              '    "--offline",\n'
              '    "--only-dev",\n'
              '    "--refresh",\n'
              '    "--reinstall",\n'
              '}\n'
              '_UV_RUN_SHORT_FLAG_OPTIONS = {"-q", "-v"}\n',
          )
          if '_UV_RUN_LONG_FLAG_OPTIONS' not in phases:
              raise SystemExit("failed to insert recognized uv flag options")

          phases = phases.replace(
              'def _python_validation_command(parts: Sequence[str]) -> bool:\n',
              'def is_python_validation_command(parts: Sequence[str]) -> bool:\n',
              1,
          )
          phases = phases.replace(
              '    """Strip uv-run options without mistaking their values for the nested command."""\n',
              '    """Strip recognized uv-run options without mistaking option values for the nested command."""\n',
              1,
          )
          phases = phases.replace(
              '        if lowered in _UV_RUN_LONG_OPTIONS_WITH_VALUES:\n'
              '            if index + 1 >= len(items):\n'
              '                return []\n'
              '            index += 2\n'
              '            continue\n'
              '        index += 1\n'
              '    return []\n\n\n'
              'def _is_validation_command(argv: Any) -> bool:\n',
              '        if lowered in _UV_RUN_LONG_OPTIONS_WITH_VALUES:\n'
              '            if index + 1 >= len(items):\n'
              '                return []\n'
              '            index += 2\n'
              '            continue\n'
              '        if lowered in _UV_RUN_LONG_FLAG_OPTIONS or token in _UV_RUN_SHORT_FLAG_OPTIONS:\n'
              '            index += 1\n'
              '            continue\n'
              '        # Unknown standalone options may consume the next token. Evidence classification\n'
              '        # must fail closed rather than treating a possible option value as the command.\n'
              '        return []\n'
              '    return []\n\n\n'
              'def is_validation_command(argv: Any) -> bool:\n',
              1,
          )
          phases = phases.replace(
              '        return _python_validation_command(parts[1:])\n',
              '        return is_python_validation_command(parts[1:])\n',
          )
          phases = phases.replace(
              '            return _python_validation_command(arguments[1:])\n',
              '            return is_python_validation_command(arguments[1:])\n',
          )
          phases = phases.replace(
              '            if _is_validation_command(args.get("argv")):\n',
              '            if is_validation_command(args.get("argv")):\n',
              1,
          )
          alias_anchor = '\n\ndef advance_phase(\n'
          if alias_anchor not in phases:
              raise SystemExit("failed to find validation classifier alias anchor")
          phases = phases.replace(
              alias_anchor,
              '\n\n# Backward-compatible private aliases for existing callers and tests.\n'
              '_python_validation_command = is_python_validation_command\n'
              '_is_validation_command = is_validation_command\n'
              + alias_anchor,
              1,
          )
          phases_path.write_text(phases, encoding="utf-8")

          agent_path = Path("services/gateway/app/coding_agent.py")
          agent = agent_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'def _is_python_validation_command\(parts: List\[str\]\) -> bool:\n.*?\n\ndef _validation_command_failed_due_to_missing_tool',
              re.DOTALL,
          )
          replacement = (
              'def _is_python_validation_command(parts: List[str]) -> bool:\n'
              '    return coding_work_phases.is_python_validation_command(parts)\n\n\n'
              'def _is_validation_command(argv: Any) -> bool:\n'
              '    return coding_work_phases.is_validation_command(argv)\n\n\n'
              'def _validation_command_failed_due_to_missing_tool'
          )
          agent, count = pattern.subn(replacement, agent, count=1)
          if count != 1:
              raise SystemExit(f"expected one coding_agent classifier block, replaced {count}")
          agent_path.write_text(agent, encoding="utf-8")
          PY

          python -m py_compile \
            services/gateway/app/coding_work_phases.py \
            services/gateway/app/coding_agent.py

          rm -f .github/workflows/pr67-consolidate-validation-classifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/gateway/app/coding_work_phases.py \
            services/gateway/app/coding_agent.py \
            .github/workflows/pr67-consolidate-validation-classifier.yml
          git diff --cached --check
          git commit -m "Consolidate coding validation classification"
          git push origin HEAD:agent/evidence-qualified-code-reviews
