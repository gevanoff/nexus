name: PR96 one-shot publication identity compatibility patch

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - name: Make structured publication return backward compatible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/gateway/app/coding_semantic_acceptance_contract.py')
          text = path.read_text()
          old = '''            publication = original_record_semantic_acceptance(\n                terminal_obj,\n                cw_obj,\n                agent_obj,\n                task_id,\n                return_publication=True,\n            )\n            publication_info = _mapping(publication)'''
          new = '''            try:\n                publication = original_record_semantic_acceptance(\n                    terminal_obj,\n                    cw_obj,\n                    agent_obj,\n                    task_id,\n                    return_publication=True,\n                )\n            except TypeError as exc:\n                # Synthetic/legacy recorders may not expose the structured-return\n                # keyword. Run them for compatibility, but without an exact\n                # publication identity stale cleanup must fail closed.\n                if "return_publication" not in str(exc):\n                    raise\n                original_record_semantic_acceptance(\n                    terminal_obj,\n                    cw_obj,\n                    agent_obj,\n                    task_id,\n                )\n                publication = {}\n            publication_info = _mapping(publication)'''
          if text.count(old) != 1:
              raise SystemExit(f'publication call marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          compile(text, str(path), 'exec')
          path.write_text(text)
          PY
      - name: Commit compatibility patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/gateway/app/coding_semantic_acceptance_contract.py
          git diff --cached --check
          git commit -m 'Fail closed without publication identity'
          git push origin HEAD:agent/semantic-acceptance-contract
