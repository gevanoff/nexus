name: PR96 final review-boundary patch

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source hardening
        shell: bash
        run: |
          cat > /tmp/pr96_patch.py <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_s}: expected one exact marker, got {count}: {old[:180]!r}")
              path.write_text(text.replace(old, new, 1))

          def replace_span(path_s, start, end, new, *, include_end=True):
              path = Path(path_s)
              text = path.read_text()
              if text.count(start) != 1:
                  raise SystemExit(f"{path_s}: start marker count={text.count(start)}: {start!r}")
              start_i = text.index(start)
              end_i = text.index(end, start_i)
              if include_end:
                  end_i += len(end)
              path.write_text(text[:start_i] + new + text[end_i:])

          epoch = "services/gateway/app/coding_mission_acceptance_epoch.py"
          contract = "services/gateway/app/coding_semantic_acceptance_contract.py"

          replace_once(
              epoch,
              "def _mapping(value: Any) -> Mapping[str, Any]:\n    return value if isinstance(value, Mapping) else {}\n\n\ndef _float(value: Any) -> float:\n",
              "def _mapping(value: Any) -> Mapping[str, Any]:\n    return value if isinstance(value, Mapping) else {}\n\n\ndef _consume_semantic_review_identity(\n    value: Any,\n) -> tuple[Dict[str, Any], Mapping[str, Any]]:\n    result = dict(value) if isinstance(value, Mapping) else {}\n    identity = _mapping(\n        result.pop(\"_semantic_acceptance_review_identity\", {})\n    )\n    return result, identity\n\n\ndef _float(value: Any) -> float:\n",
          )

          replace_span(
              epoch,
              "    initial = cw.load_task(task_id)\n    explicit_review_identity =",
              "    max_attempts = 2\n",
              "    bound_fingerprint = str(reviewed_fingerprint or \"\").strip()\n    if not bound_fingerprint or reviewed_cycle is None:\n        return {} if return_publication else False\n    bound_cycle = _int(reviewed_cycle)\n    initial = cw.load_task(task_id)\n    if _int(initial.get(\"agent_cycle\")) != bound_cycle:\n        return {} if return_publication else False\n    reviewed_fingerprint = bound_fingerprint\n    reviewed_cycle = bound_cycle\n    max_attempts = 2\n",
          )

          replace_once(
              epoch,
              "        def apply(latest: Dict[str, Any]) -> None:\n            nonlocal published, published_generation\n            current = dict(_mapping(latest.get(KEY)))\n",
              "        def apply(latest: Dict[str, Any]) -> None:\n            nonlocal published, published_generation\n            if _int(latest.get(\"agent_cycle\")) != reviewed_cycle:\n                return\n            current = dict(_mapping(latest.get(KEY)))\n",
          )

          replace_span(
              epoch,
              "        try:\n            before_task = cw.load_task(task_id)\n        except Exception:\n",
              "\n\n        forced_state = forced_action.active_state(before_task)",
              "        try:\n            before_task = cw.load_task(task_id)\n        except Exception:\n            delegated, _ = _consume_semantic_review_identity(\n                original_run_tool(\n                    task_id,\n                    name,\n                    args,\n                    git_token_value=git_token_value,\n                )\n            )\n            return delegated\n\n        forced_state = forced_action.active_state(before_task)",
          )

          replace_once(
              epoch,
              "        result = dict(\n            original_run_tool(\n                task_id,\n                name,\n                args,\n                git_token_value=git_token_value,\n            )\n        )\n        review_identity = _mapping(\n            result.pop(\"_semantic_acceptance_review_identity\", {})\n        )\n",
              "        result, review_identity = _consume_semantic_review_identity(\n            original_run_tool(\n                task_id,\n                name,\n                args,\n                git_token_value=git_token_value,\n            )\n        )\n",
          )

          replace_once(
              contract,
              "    if callable(original_record_semantic_acceptance) and callable(latest_accepted_review):\n",
              "    if callable(original_record_semantic_acceptance):\n",
          )

          replace_span(
              contract,
              "            if terminal_obj is not terminal_hardening or cw_obj is not cw or agent_obj is not agent:\n",
              "            if not reviewed_fingerprint:\n",
              "            if terminal_obj is not terminal_hardening or cw_obj is not cw or agent_obj is not agent:\n                return original_record_semantic_acceptance(\n                    terminal_obj,\n                    cw_obj,\n                    agent_obj,\n                    task_id,\n                    reviewed_fingerprint=reviewed_fingerprint,\n                    reviewed_cycle=reviewed_cycle,\n                    return_publication=return_publication,\n                )\n\n            before = cw_obj.load_task(task_id)\n            reviewed_fingerprint = str(reviewed_fingerprint or \"\").strip()\n            if not reviewed_fingerprint or reviewed_cycle is None:\n",
          )

          replace_once(
              contract,
              "                message = (\n                    \"Refusing to record semantic acceptance because the latest accepted review \"\n                    \"has no acceptance fingerprint.\"\n                )\n",
              "                message = (\n                    \"Refusing to record semantic acceptance because no complete \"\n                    \"invocation-local review identity was supplied.\"\n                )\n",
          )

          replace_once(
              contract,
              "                except Exception:\n                    pass\n                return\n\n            current_fingerprint = current_review_fingerprint(\n",
              "                except Exception:\n                    pass\n                return\n\n            effective_reviewed_cycle = int(reviewed_cycle)\n            if int(before.get(\"agent_cycle\") or 0) != effective_reviewed_cycle:\n                return\n\n            current_fingerprint = current_review_fingerprint(\n",
          )

          replace_span(
              contract,
              "            try:\n                publication = original_record_semantic_acceptance(\n",
              "                    publication = {}\n",
              "            publication = original_record_semantic_acceptance(\n                terminal_obj,\n                cw_obj,\n                agent_obj,\n                task_id,\n                reviewed_fingerprint=reviewed_fingerprint,\n                reviewed_cycle=effective_reviewed_cycle,\n                return_publication=True,\n            )\n",
          )
          PY
          python /tmp/pr96_patch.py
          python -m py_compile services/gateway/app/coding_mission_acceptance_epoch.py services/gateway/app/coding_semantic_acceptance_contract.py
          git diff --check
      - name: Install Gateway test dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
      - name: Run focused acceptance tests
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_mission_acceptance_epoch_review_binding.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_cas.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_retry.py \
            services/gateway/tests/test_coding_mission_acceptance_publication_generation.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_integrity.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_post_record_race.py
      - name: Run full Gateway suite
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: python -m pytest -q --tb=short services/gateway/tests
      - name: Commit clean source patch
        shell: bash
        run: |
          git rm .github/workflows/pr96-final-review-boundary-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/gateway/app/coding_mission_acceptance_epoch.py services/gateway/app/coding_semantic_acceptance_contract.py
          git commit -m "Require complete semantic review identity"
          git push origin HEAD:agent/semantic-acceptance-contract
