name: PR96 final review-boundary patch

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source hardening
        shell: bash
        run: |
          cat > /tmp/pr96_patch.py <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_s}: expected one marker, got {count}\nMARKER:\n{old[:600]}")
              path.write_text(text.replace(old, new, 1))

          epoch = "services/gateway/app/coding_mission_acceptance_epoch.py"
          contract = "services/gateway/app/coding_semantic_acceptance_contract.py"

          replace_once(
              epoch,
              """def _mapping(value: Any) -> Mapping[str, Any]:
              return value if isinstance(value, Mapping) else {}


          def _float(value: Any) -> float:
          """.replace("          ", ""),
              """def _mapping(value: Any) -> Mapping[str, Any]:
              return value if isinstance(value, Mapping) else {}


          def _consume_semantic_review_identity(
              value: Any,
          ) -> tuple[Dict[str, Any], Mapping[str, Any]]:
              result = dict(value) if isinstance(value, Mapping) else {}
              identity = _mapping(
                  result.pop("_semantic_acceptance_review_identity", {})
              )
              return result, identity


          def _float(value: Any) -> float:
          """.replace("          ", ""),
          )

          replace_once(
              epoch,
              """    initial = cw.load_task(task_id)
              explicit_review_identity = reviewed_cycle is not None or bool(
                  str(reviewed_fingerprint or "").strip()
              )
              if explicit_review_identity:
                  bound_fingerprint = str(reviewed_fingerprint or "").strip()
                  bound_cycle = _int(reviewed_cycle)
              else:
                  review = _latest_accepted_review(initial)
                  if not review:
                      return False
                  bound_fingerprint = str(review.get("fingerprint") or "").strip()
                  bound_cycle = _int(review.get("cycle") or initial.get("agent_cycle"))
              if not bound_fingerprint:
                  return False
              if _int(initial.get("agent_cycle")) != bound_cycle:
                  return False
              reviewed_fingerprint = bound_fingerprint
              reviewed_cycle = bound_cycle
              max_attempts = 2
          """.replace("              ", ""),
              """    bound_fingerprint = str(reviewed_fingerprint or "").strip()
              if not bound_fingerprint or reviewed_cycle is None:
                  return {} if return_publication else False
              bound_cycle = _int(reviewed_cycle)
              initial = cw.load_task(task_id)
              if _int(initial.get("agent_cycle")) != bound_cycle:
                  return {} if return_publication else False
              reviewed_fingerprint = bound_fingerprint
              reviewed_cycle = bound_cycle
              max_attempts = 2
          """.replace("              ", ""),
          )

          replace_once(
              epoch,
              """        def apply(latest: Dict[str, Any]) -> None:
                  nonlocal published, published_generation
                  current = dict(_mapping(latest.get(KEY)))
                  if str(current.get("base_head") or "") != base_head:
                      return
          """.replace("              ", ""),
              """        def apply(latest: Dict[str, Any]) -> None:
                  nonlocal published, published_generation
                  if _int(latest.get("agent_cycle")) != reviewed_cycle:
                      return
                  current = dict(_mapping(latest.get(KEY)))
                  if str(current.get("base_head") or "") != base_head:
                      return
          """.replace("              ", ""),
          )

          replace_once(
              epoch,
              """        try:
                  before_task = cw.load_task(task_id)
              except Exception:
                  return original_run_tool(
                      task_id,
                      name,
                      args,
                      git_token_value=git_token_value,
                  )
          """.replace("              ", ""),
              """        try:
                  before_task = cw.load_task(task_id)
              except Exception:
                  delegated, _ = _consume_semantic_review_identity(
                      original_run_tool(
                          task_id,
                          name,
                          args,
                          git_token_value=git_token_value,
                      )
                  )
                  return delegated
          """.replace("              ", ""),
          )

          replace_once(
              epoch,
              """        result = dict(
                  original_run_tool(
                      task_id,
                      name,
                      args,
                      git_token_value=git_token_value,
                  )
              )
              review_identity = _mapping(
                  result.pop("_semantic_acceptance_review_identity", {})
              )
          """.replace("              ", ""),
              """        result, review_identity = _consume_semantic_review_identity(
                  original_run_tool(
                      task_id,
                      name,
                      args,
                      git_token_value=git_token_value,
                  )
              )
          """.replace("              ", ""),
          )

          replace_once(
              contract,
              "    if callable(original_record_semantic_acceptance) and callable(latest_accepted_review):\n",
              "    if callable(original_record_semantic_acceptance):\n",
          )

          replace_once(
              contract,
              """            if terminal_obj is not terminal_hardening or cw_obj is not cw or agent_obj is not agent:
                  return original_record_semantic_acceptance(
                      terminal_obj,
                      cw_obj,
                      agent_obj,
                      task_id,
                  )

              before = cw_obj.load_task(task_id)
              explicit_review_identity = reviewed_cycle is not None or bool(
                  str(reviewed_fingerprint or "").strip()
              )
              if explicit_review_identity:
                  reviewed_fingerprint = str(reviewed_fingerprint or "").strip()
                  effective_reviewed_cycle = (
                      int(reviewed_cycle)
                      if reviewed_cycle is not None
                      else int(before.get("agent_cycle") or 0)
                  )
              else:
                  review = _mapping(latest_accepted_review(before))
                  reviewed_fingerprint = str(review.get("fingerprint") or "").strip()
                  effective_reviewed_cycle = int(
                      review.get("cycle") or before.get("agent_cycle") or 0
                  )
              if not reviewed_fingerprint:
                  message = (
                      "Refusing to record semantic acceptance because the latest accepted review "
                      "has no acceptance fingerprint."
                  )
          """.replace("              ", ""),
              """            if terminal_obj is not terminal_hardening or cw_obj is not cw or agent_obj is not agent:
                  return original_record_semantic_acceptance(
                      terminal_obj,
                      cw_obj,
                      agent_obj,
                      task_id,
                      reviewed_fingerprint=reviewed_fingerprint,
                      reviewed_cycle=reviewed_cycle,
                      return_publication=return_publication,
                  )

              before = cw_obj.load_task(task_id)
              reviewed_fingerprint = str(reviewed_fingerprint or "").strip()
              if not reviewed_fingerprint or reviewed_cycle is None:
                  message = (
                      "Refusing to record semantic acceptance because no complete "
                      "invocation-local review identity was supplied."
                  )
          """.replace("              ", ""),
          )

          replace_once(
              contract,
              """                return

              current_fingerprint = current_review_fingerprint(
          """.replace("              ", ""),
              """                return

              effective_reviewed_cycle = int(reviewed_cycle)
              if int(before.get("agent_cycle") or 0) != effective_reviewed_cycle:
                  return

              current_fingerprint = current_review_fingerprint(
          """.replace("              ", ""),
          )

          old = """            try:
                  publication = original_record_semantic_acceptance(
                      terminal_obj,
                      cw_obj,
                      agent_obj,
                      task_id,
                      reviewed_fingerprint=reviewed_fingerprint,
                      reviewed_cycle=effective_reviewed_cycle,
                      return_publication=True,
                  )
              except TypeError as exc:
                  # Synthetic/legacy recorders may not expose invocation identity.
                  # Production owner code does; compatibility recorders still need
                  # an exact structured publication identity for cleanup.
                  if not any(
                      token in str(exc)
                      for token in (
                          "reviewed_fingerprint",
                          "reviewed_cycle",
                          "return_publication",
                      )
                  ):
                      raise
                  try:
                      publication = original_record_semantic_acceptance(
                          terminal_obj,
                          cw_obj,
                          agent_obj,
                          task_id,
                          return_publication=True,
                      )
                  except TypeError as legacy_exc:
                      if "return_publication" not in str(legacy_exc):
                          raise
                      original_record_semantic_acceptance(
                          terminal_obj,
                          cw_obj,
                          agent_obj,
                          task_id,
                      )
                      publication = {}
          """.replace("              ", "")
          new = """            publication = original_record_semantic_acceptance(
                  terminal_obj,
                  cw_obj,
                  agent_obj,
                  task_id,
                  reviewed_fingerprint=reviewed_fingerprint,
                  reviewed_cycle=effective_reviewed_cycle,
                  return_publication=True,
              )
          """.replace("              ", "")
          replace_once(contract, old, new)
          PY
          python /tmp/pr96_patch.py
          python -m py_compile services/gateway/app/coding_mission_acceptance_epoch.py services/gateway/app/coding_semantic_acceptance_contract.py
          git diff --check
      - name: Install Gateway test dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
      - name: Run focused acceptance tests
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_mission_acceptance_epoch_review_binding.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_cas.py \
            services/gateway/tests/test_coding_mission_acceptance_epoch_publication_retry.py \
            services/gateway/tests/test_coding_mission_acceptance_publication_generation.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_integrity.py \
            services/gateway/tests/test_coding_semantic_acceptance_contract_post_record_race.py
      - name: Run full Gateway suite
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: python -m pytest -q --tb=short services/gateway/tests
      - name: Commit clean source patch
        shell: bash
        run: |
          git rm .github/workflows/pr96-final-review-boundary-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/gateway/app/coding_mission_acceptance_epoch.py services/gateway/app/coding_semantic_acceptance_contract.py
          git commit -m "Require complete semantic review identity"
          git push origin HEAD:agent/semantic-acceptance-contract
