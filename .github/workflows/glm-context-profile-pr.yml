name: Apply GLM context profile implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/glm-coding-context-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/glm-coding-context-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt
      - name: Extract and apply implementation
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          source = Path('.github/workflows/glm-context-profile-bootstrap.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply_glm_profiles.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYCODE
          python /tmp/apply_glm_profiles.py
      - name: Install Gateway test dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m pip check
      - name: Prepare writable Gateway runtime paths
        shell: bash
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus
      - name: Validate implementation
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m py_compile \
            services/gateway/app/context_budget.py \
            services/gateway/app/model_aliases.py \
            services/gateway/app/upstreams.py \
            services/gateway/app/coding_agent.py
          python -m pytest -q --tb=short \
            services/gateway/tests/test_glm_context_profiles.py \
            services/gateway/tests/test_upstreams_message_normalization.py \
            services/gateway/tests/test_coding_mission_finalization.py
          python -m pytest -q --tb=short services/gateway/tests
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm -f \
            .github/workflows/glm-context-profile-bootstrap.yml \
            .github/workflows/glm-context-profile-pr.yml
          git config user.name "Nexus Context Profile Bot"
          git config user.email "nexus-context-profile@users.noreply.github.com"
          git add -A
          git commit -m "Add GLM coding context profiles"
          git push origin HEAD:agent/glm-coding-context-profiles
