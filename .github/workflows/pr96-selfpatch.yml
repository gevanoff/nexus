name: PR96 one-shot acceptance CAS source patch

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - name: Patch owning acceptance CAS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/gateway/app/coding_mission_acceptance_epoch.py')
          text = path.read_text()
          lines = text.splitlines()

          observed_index = next(
              i
              for i in range(len(lines) - 3)
              if lines[i].strip() == 'observed_accepted_fingerprint = str('
              and lines[i + 1].strip()
              == '_mapping(task.get(KEY)).get("accepted_fingerprint") or ""'
              and lines[i + 2].strip() == ').strip()'
              and lines[i + 3].strip() == 'published = False'
          )
          observed_indent = lines[observed_index][
              : len(lines[observed_index]) - len(lines[observed_index].lstrip())
          ]
          lines[observed_index : observed_index + 4] = [
              observed_indent + 'observed_epoch = _mapping(task.get(KEY))',
              observed_indent + 'observed_accepted_fingerprint = str(',
              observed_indent + '    observed_epoch.get("accepted_fingerprint") or ""',
              observed_indent + ').strip()',
              observed_indent
              + 'observed_last_mutation_at = _float(observed_epoch.get("last_mutation_at"))',
              observed_indent + 'observed_last_mutation_run_id = str(',
              observed_indent + '    observed_epoch.get("last_mutation_run_id") or ""',
              observed_indent + ')',
              observed_indent + 'published = False',
          ]

          cas_index = next(
              i
              for i in range(len(lines) - 4)
              if lines[i].strip() == 'if ('
              and lines[i + 1].strip()
              == 'str(current.get("accepted_fingerprint") or "").strip()'
              and lines[i + 2].strip() == '!= observed_accepted_fingerprint'
              and lines[i + 3].strip() == '):'
              and lines[i + 4].strip() == 'return'
          )
          cas_indent = lines[cas_index][
              : len(lines[cas_index]) - len(lines[cas_index].lstrip())
          ]
          cont = cas_indent + '    '
          lines[cas_index : cas_index + 5] = [
              cas_indent + 'current_accepted_fingerprint = str(',
              cont + 'current.get("accepted_fingerprint") or ""',
              cas_indent + ').strip()',
              cas_indent + 'acceptance_unchanged = (',
              cont + 'current_accepted_fingerprint == observed_accepted_fingerprint',
              cas_indent + ')',
              cas_indent + 'cleanup_cleared_observed_stale = (',
              cont + 'attempt > 0',
              cont + 'and bool(observed_accepted_fingerprint)',
              cont + 'and not current_accepted_fingerprint',
              cont + 'and str(current.get("status") or "") == "pending"',
              cont + 'and not _float(current.get("accepted_at"))',
              cont + 'and not str(current.get("accepted_head") or "").strip()',
              cont + 'and not str(current.get("accepted_run_id") or "").strip()',
              cont + 'and not str(current.get("accepted_diff_sha256") or "").strip()',
              cont + 'and _float(current.get("last_mutation_at"))',
              cont + '== observed_last_mutation_at',
              cont + 'and str(current.get("last_mutation_run_id") or "")',
              cont + '== observed_last_mutation_run_id',
              cas_indent + ')',
              cas_indent
              + 'if not acceptance_unchanged and not cleanup_cleared_observed_stale:',
              cont + 'return',
          ]

          updated = '\n'.join(lines) + '\n'
          compile(updated, str(path), 'exec')
          path.write_text(updated)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/gateway/app/coding_mission_acceptance_epoch.py
          git diff --cached --check
          git commit -m 'Allow publication after stale acceptance cleanup'
          git push origin HEAD:agent/semantic-acceptance-contract
