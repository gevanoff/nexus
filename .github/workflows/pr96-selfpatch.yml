name: PR96 one-shot acceptance CAS source patch

on:
  push:
    branches:
      - agent/semantic-acceptance-contract

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-acceptance-contract
          fetch-depth: 0
      - name: Patch owning acceptance CAS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/gateway/app/coding_mission_acceptance_epoch.py')
          text = path.read_text()

          old_observed = '''        observed_accepted_fingerprint = str(
              _mapping(task.get(KEY)).get("accepted_fingerprint") or ""
          ).strip()
          published = False
          '''
          new_observed = '''        observed_epoch = _mapping(task.get(KEY))
          observed_accepted_fingerprint = str(
              observed_epoch.get("accepted_fingerprint") or ""
          ).strip()
          observed_last_mutation_at = _float(observed_epoch.get("last_mutation_at"))
          observed_last_mutation_run_id = str(
              observed_epoch.get("last_mutation_run_id") or ""
          )
          published = False
          '''

          old_cas = '''            if (
                  str(current.get("accepted_fingerprint") or "").strip()
                  != observed_accepted_fingerprint
              ):
                  return
          '''
          new_cas = '''            current_accepted_fingerprint = str(
                  current.get("accepted_fingerprint") or ""
              ).strip()
              acceptance_unchanged = (
                  current_accepted_fingerprint == observed_accepted_fingerprint
              )
              cleanup_cleared_observed_stale = (
                  attempt > 0
                  and bool(observed_accepted_fingerprint)
                  and not current_accepted_fingerprint
                  and str(current.get("status") or "") == "pending"
                  and not _float(current.get("accepted_at"))
                  and not str(current.get("accepted_head") or "").strip()
                  and not str(current.get("accepted_run_id") or "").strip()
                  and not str(current.get("accepted_diff_sha256") or "").strip()
                  and _float(current.get("last_mutation_at"))
                  == observed_last_mutation_at
                  and str(current.get("last_mutation_run_id") or "")
                  == observed_last_mutation_run_id
              )
              if not acceptance_unchanged and not cleanup_cleared_observed_stale:
                  return
          '''

          if text.count(old_observed) != 1:
              raise SystemExit(f'observed block count={text.count(old_observed)}')
          if text.count(old_cas) != 1:
              raise SystemExit(f'CAS block count={text.count(old_cas)}')

          text = text.replace(old_observed, new_observed, 1)
          text = text.replace(old_cas, new_cas, 1)
          compile(text, str(path), 'exec')
          path.write_text(text)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/gateway/app/coding_mission_acceptance_epoch.py
          git diff --cached --check
          git commit -m 'Allow publication after stale acceptance cleanup'
          git push origin HEAD:agent/semantic-acceptance-contract
