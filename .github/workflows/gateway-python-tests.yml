name: Gateway Python Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gateway-python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: Full Gateway pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt

      - name: Install Gateway test dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip --version | tee "${RUNNER_TEMP}/gateway-pip-install.log"
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt \
            2>&1 | tee -a "${RUNNER_TEMP}/gateway-pip-install.log"
          python -m pip check 2>&1 | tee -a "${RUNNER_TEMP}/gateway-pip-install.log"
          python -m pip freeze --all | sort > "${RUNNER_TEMP}/gateway-python-environment.txt"

      - name: Prepare writable Gateway runtime paths
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus

      - name: Run full Gateway test suite
        timeout-minutes: 25
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          set +e
          python -m pytest \
            -q \
            --tb=short \
            --durations=25 \
            --junitxml="${RUNNER_TEMP}/gateway-pytest.xml" \
            services/gateway/tests \
            > "${RUNNER_TEMP}/gateway-pytest.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/gateway-pytest.log"
          exit "$status"

      - name: Upload Gateway pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-pytest-diagnostics
          path: |
            ${{ runner.temp }}/gateway-pip-install.log
            ${{ runner.temp }}/gateway-python-environment.txt
            ${{ runner.temp }}/gateway-pytest.log
            ${{ runner.temp }}/gateway-pytest.xml
          if-no-files-found: warn
          retention-days: 7
