name: Address PR 63 review comments

on:
  push:
    branches:
      - agent/glm-coding-context-profiles

permissions:
  contents: write

concurrency:
  group: address-pr63-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/glm-coding-context-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt
      - name: Apply review fixes
        run: python services/gateway/tools/address_pr63_review.py
      - name: Install Gateway dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m pip check
      - name: Prepare runtime paths
        shell: bash
        run: |
          sudo mkdir -p /var/lib/gateway/app /var/lib/gateway/config /var/lib/gateway/data/agent /var/lib/gateway/data/coding/tasks /var/lib/gateway/data/coding/workspaces /var/lib/gateway/data/model_benchmarks /var/lib/gateway/data/model_tool_qualification /var/lib/gateway/data/sentinel /var/lib/gateway/data/tools /var/lib/gateway/data/ui_chats /var/lib/gateway/data/ui_files /var/lib/gateway/data/ui_images /var/lib/gateway/data/voice_library /var/lib/gateway/tools /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus
      - name: Validate focused and full suites
        timeout-minutes: 25
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m py_compile services/gateway/app/coding_agent.py
          python -m pytest -q --tb=short \
            services/gateway/tests/test_glm_context_profiles.py \
            services/gateway/tests/test_coding_mission_finalization.py \
            services/gateway/tests/test_coding_agent_no_change_audit.py
          python -m pytest -q --tb=short services/gateway/tests
          git diff --check
      - name: Commit fixes and restore permanent CI
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/gateway-python-tests.yml
          rm -f \
            services/gateway/tools/address_pr63_review.py \
            .pr63-review-trigger
          git config user.name "Nexus Review Fix Bot"
          git config user.email "nexus-review-fix@users.noreply.github.com"
          git add -A
          git commit -m "Honor resolved coding model budgets"
          git push origin HEAD:agent/glm-coding-context-profiles
