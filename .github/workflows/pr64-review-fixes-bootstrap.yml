name: PR 64 Review Fixes Bootstrap

on:
  push:
    branches:
      - agent/enforce-coding-forced-action

permissions:
  contents: read

concurrency:
  group: pr64-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-review-fixes:
    if: github.repository == 'gevanoff/nexus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/enforce-coding-forced-action
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt

      - name: Install Gateway test dependencies
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m pip check

      - name: Apply review fixes
        run: python services/gateway/tools/apply_pr64_review_fixes.py

      - name: Prepare writable Gateway runtime paths
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus

      - name: Run focused review regression suites
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        run: |
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_forced_action.py \
            services/gateway/tests/test_coding_mission_finalization.py \
            services/gateway/tests/test_coding_stagnation_resilience.py
          python -m py_compile \
            services/gateway/app/coding_agent.py \
            services/gateway/app/coding_semantic_memory.py \
            services/gateway/app/coding_stagnation_resilience.py \
            services/gateway/app/coding_workspace.py
          git diff --check

      - name: Replace bootstrap with reviewed implementation
        run: |
          rm -f \
            services/gateway/tools/apply_pr64_review_fixes.py \
            .github/workflows/pr64-review-fixes-bootstrap.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Review bootstrap produced no changes." >&2
            exit 1
          fi
          git config user.name "Nexus Review Agent"
          git config user.email "nexus-review-agent@users.noreply.github.com"
          git commit -m "Address forced-action review findings"
          git push origin HEAD:agent/enforce-coding-forced-action
