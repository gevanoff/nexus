name: Finalize semantic recovery robustness v2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-semantic-memory-cycle-race

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply robustness corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_path = Path("services/gateway/app/coding_agent.py")
          agent = agent_path.read_text(encoding="utf-8")
          old = '''    checkpoint_injected = False
          checkpoint_check_completed = False
          try:
              checkpoint_injected = bool(
                  await asyncio.to_thread(coding_semantic_memory.process_task, task_id)
              )
              checkpoint_check_completed = True
          '''
          new = '''    checkpoint_injected = False
          try:
              checkpoint_injected = bool(
                  await asyncio.to_thread(coding_semantic_memory.process_task, task_id)
              )
          '''
          if agent.count(old) != 1:
              raise SystemExit(f"expected one checkpoint-completion anchor, found {agent.count(old)}")
          agent = agent.replace(old, new, 1)
          old_summary = '                "summary": f"{type(exc).__name__}: {exc}",\n'
          if agent.count(old_summary) != 1:
              raise SystemExit(f"expected one error-summary anchor, found {agent.count(old_summary)}")
          agent = agent.replace(
              old_summary,
              '                "summary": _clip_text(f"{type(exc).__name__}: {exc}", 1000),\n',
              1,
          )
          old_condition = '    if decision.pause and not fresh_checkpoint and checkpoint_check_completed:\n'
          if agent.count(old_condition) != 1:
              raise SystemExit(f"expected one freshness-condition anchor, found {agent.count(old_condition)}")
          agent = agent.replace(old_condition, '    if decision.pause and not fresh_checkpoint:\n', 1)
          agent_path.write_text(agent, encoding="utf-8")

          guard_path = Path("services/gateway/tests/test_coding_runtime_guardrails.py")
          guard = guard_path.read_text(encoding="utf-8")
          old_guard = '''    # The cycle-four semantic checkpoint becomes controller guidance on the
          # following cycle and earns exactly one reset. With no edit, validation,
          # review, plan-state change, or finish transition afterward, the run still
          # terminates deterministically after a second stagnant streak.
          assert tool_calls == 13 * len(batch)
          '''
          new_guard = '''    # The staged checkpoint becomes controller guidance on the following
          # cycle and earns exactly one reset. With no edit, validation, review,
          # plan-state change, or finish transition afterward, the run still
          # terminates deterministically after a second stagnant streak.
          checkpoint_cycle = coding_agent.coding_semantic_memory._stagnation_threshold(
              {**task, "mission": mission}
          )
          expected_cycles = (
              checkpoint_cycle
              + 1
              + int(mission["budget_policy"]["max_no_progress_cycles"])
          )
          assert tool_calls == expected_cycles * len(batch)
          '''
          if guard.count(old_guard) != 1:
              raise SystemExit(f"expected one guardrail assertion anchor, found {guard.count(old_guard)}")
          guard_path.write_text(guard.replace(old_guard, new_guard, 1), encoding="utf-8")

          semantic_path = Path("services/gateway/tests/test_coding_semantic_memory.py")
          semantic = semantic_path.read_text(encoding="utf-8")
          insert_anchor = '''@pytest.mark.asyncio
          async def test_cycle_boundary_pauses_after_checkpoint_credit_is_used(monkeypatch):
          '''
          inserted = '''@pytest.mark.asyncio
          async def test_cycle_boundary_recovers_after_sync_failure_when_scanner_injected(monkeypatch):
              calls = []
              decision = SimpleNamespace(
                  pause=True,
                  reason_code="no_progress_limit",
                  summary="paused",
                  state=SimpleNamespace(stagnant_cycles=8),
              )

              def fail_checkpoint(_task_id):
                  calls.append(("checkpoint", "failed"))
                  raise RuntimeError("synchronous check unavailable")

              monkeypatch.setattr(coding_agent.coding_semantic_memory, "process_task", fail_checkpoint)
              monkeypatch.setattr(
                  coding_agent.cw,
                  "load_task",
                  lambda _task_id: {
                      "agent_run_id": "run-2",
                      "agent_investigation_checkpoint": {"run_id": "run-2", "cycle": 8},
                  },
              )
              monkeypatch.setattr(
                  coding_agent,
                  "_append_event",
                  lambda task_id, event: calls.append(("event", event["type"])) or event,
              )

              await coding_agent._enforce_cycle_progress_decision(
                  "code_abcdef123456",
                  cycle=8,
                  decision=decision,
              )

              assert calls == [
                  ("checkpoint", "failed"),
                  ("event", "investigation_checkpoint_error"),
                  ("event", "no_progress_recovery"),
              ]


          @pytest.mark.asyncio
          async def test_cycle_boundary_pauses_after_checkpoint_credit_is_used(monkeypatch):
          '''
          if semantic.count(insert_anchor) != 1:
              raise SystemExit(f"expected one semantic insertion anchor, found {semantic.count(insert_anchor)}")
          semantic = semantic.replace(insert_anchor, inserted, 1)

          old_failure = '''    def fail_checkpoint(_task_id):
              calls.append(("checkpoint", "failed"))
              raise RuntimeError("checkpoint unavailable")

          monkeypatch.setattr(coding_agent.coding_semantic_memory, "process_task", fail_checkpoint)
          monkeypatch.setattr(
              coding_agent,
              "_append_event",
              lambda task_id, event: calls.append(("event", event["type"])) or event,
          )
          '''
          new_failure = '''    events = []

          def fail_checkpoint(_task_id):
              calls.append(("checkpoint", "failed"))
              raise RuntimeError("x" * 5000)

          def record_event(_task_id, event):
              events.append(event)
              calls.append(("event", event["type"]))
              return event

          monkeypatch.setattr(coding_agent.coding_semantic_memory, "process_task", fail_checkpoint)
          monkeypatch.setattr(coding_agent, "_append_event", record_event)
          '''
          if semantic.count(old_failure) != 1:
              raise SystemExit(f"expected one failure-test anchor, found {semantic.count(old_failure)}")
          semantic = semantic.replace(old_failure, new_failure, 1)
          old_tail = '''    assert calls == [
              ("checkpoint", "failed"),
              ("event", "investigation_checkpoint_error"),
              ("event", "no_progress_limit"),
          ]


          @pytest.mark.asyncio
          async def test_runtime_start_and_stop_are_idempotent(monkeypatch):
          '''
          new_tail = '''    assert calls == [
              ("checkpoint", "failed"),
              ("event", "investigation_checkpoint_error"),
              ("event", "no_progress_limit"),
          ]
          assert "truncated" in events[0]["summary"]
          assert len(events[0]["summary"]) < 1100


          @pytest.mark.asyncio
          async def test_runtime_start_and_stop_are_idempotent(monkeypatch):
          '''
          if semantic.count(old_tail) != 1:
              raise SystemExit(f"expected one failure-test tail, found {semantic.count(old_tail)}")
          semantic_path.write_text(semantic.replace(old_tail, new_tail, 1), encoding="utf-8")

          Path(".github/workflows/finalize-semantic-recovery-robustness.yml").unlink(missing_ok=True)
          Path(".github/workflows/finalize-semantic-recovery-robustness-v2.yml").unlink(missing_ok=True)
          PY

      - name: Validate focused behavior
        env:
          GATEWAY_BEARER_TOKEN: test-token
          PYTHONPATH: services/gateway
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m py_compile \
            services/gateway/app/coding_agent.py \
            services/gateway/app/coding_semantic_memory.py
          python -m pytest -q \
            services/gateway/tests/test_coding_semantic_memory.py \
            services/gateway/tests/test_coding_runtime_guardrails.py

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden semantic recovery edge cases"
          git push origin HEAD:agent/fix-semantic-memory-cycle-race
