name: Discovery Execution Phase Bootstrap

on:
  push:
    branches:
      - agent/discovery-execution-phases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'nexus-review-bot'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/discovery-execution-phases
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt

      - name: Apply controller phase implementation
        run: python services/gateway/tools/apply_discovery_execution_phases.py

      - name: Install Gateway test dependencies
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m pip check

      - name: Run focused phase tests
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        run: |
          python -m py_compile \
            services/gateway/app/coding_agent.py \
            services/gateway/app/coding_runtime_guardrails.py \
            services/gateway/app/coding_stagnation_resilience.py \
            services/gateway/app/coding_semantic_memory.py \
            services/gateway/app/coding_work_phases.py
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_work_phases.py \
            services/gateway/tests/test_coding_agent_no_change_audit.py \
            services/gateway/tests/test_coding_forced_action.py

      - name: Commit direct source changes
        run: |
          rm -f \
            .github/workflows/discovery-execution-phase-bootstrap.yml \
            services/gateway/tools/apply_discovery_execution_phases.py
          git add -A
          git config user.name "nexus-review-bot"
          git config user.email "nexus-review-bot@users.noreply.github.com"
          git commit -m "Add discovery decision execution phases"
          git push origin HEAD:agent/discovery-execution-phases
