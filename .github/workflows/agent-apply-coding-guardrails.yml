name: Apply coding guardrails patch

on:
  push:
    branches:
      - agent/archive-stop-progress-guards

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/archive-stop-progress-guards
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('.github/agent-patch.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/apply_patch.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/apply_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r services/gateway/requirements.txt

      - name: Validate focused changes
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        run: |
          python -m py_compile services/gateway/app/coding_workspace.py services/gateway/app/coding_agent.py
          python -m pytest -q services/gateway/tests/test_coding_archive_stop_diagnostics.py services/gateway/tests/test_coding_agent_progress_guards.py
          git diff --check

      - name: Commit validated changes
        run: |
          rm -f .github/workflows/agent-apply-coding-guardrails.yml .github/agent-patch.b64 .github/agent-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve archive diagnostics and coding progress guards'
          git push origin HEAD:agent/archive-stop-progress-guards
