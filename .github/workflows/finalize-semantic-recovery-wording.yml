name: Finalize semantic recovery wording

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-semantic-memory-cycle-race

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correct diagnostic wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/gateway/app/coding_agent.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '"A durable investigation checkpoint was injected at the no-progress boundary. "\n'
              '                    "Granting one recovery cycle so the model can act on the required next action."'
          )
          new = (
              '"A durable investigation checkpoint was injected at the no-progress boundary. "\n'
              '                    "Granting one bounded recovery transition so the model can act on the required next action."'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one recovery diagnostic anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/finalize-semantic-recovery-wording.yml").unlink()
          PY

      - name: Validate focused behavior
        env:
          GATEWAY_BEARER_TOKEN: test-token
          PYTHONPATH: services/gateway
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m py_compile services/gateway/app/coding_agent.py
          python -m pytest -q \
            services/gateway/tests/test_coding_semantic_memory.py \
            services/gateway/tests/test_coding_runtime_guardrails.py

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify semantic recovery diagnostic"
          git push origin HEAD:agent/fix-semantic-memory-cycle-race
