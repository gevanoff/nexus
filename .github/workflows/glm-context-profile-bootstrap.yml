          write("services/gateway/tests/test_glm_context_profiles.py", tests)

          docs = '''# GLM-5.2 context profiles

Nexus exposes one resident `mlx-community/GLM-5.2-4bit` model through distinct
aliases rather than forcing chat and autonomous coding to share one context and
reasoning policy.

| Alias | Role | Advertised context | Input budget | Compaction threshold | Output cap | Thinking |
| --- | --- | ---: | ---: | ---: | ---: | --- |
| `glm-chat`, `mlx`, `ai2-chat` | Basic interactive chat | 32,768 | 26,000 estimated tokens | n/a | 4,096 | disabled |
| `coder` | Coding Workspace and repository debugging | 131,072 | 100,000 estimated tokens | 90,000 | 16,384 | enabled |
| `reasoning` | Deliberate architecture and difficult debugging | 131,072 | 100,000 estimated tokens | 90,000 | 16,384 | enabled |
| `long` | Explicitly slow long-horizon coding/reasoning | 262,144 | 210,000 estimated tokens | 185,000 | 32,768 | enabled |

## Budget semantics

`context_window` describes the model-facing profile. `max_input_tokens` is the
hard request budget and preserves room for generation and runtime overhead.
`coding_context_reset_tokens` is the Coding Workspace soft-compaction point.
Controller state, working memory, and inspection provenance remain durable
across compaction.

The Gateway uses a dependency-free conservative estimator because its process
cannot assume the 393 GB model repository or tokenizer is locally mounted. The
estimator charges ASCII code/JSON at three characters per token and non-ASCII
text at 1.5 characters per token. Rejection responses disclose that the count
is an estimate and identify the estimator. Alias budgets intentionally retain
substantial headroom, so exact tokenizer availability is not required for safe
operation.

Direct GLM model IDs that do not select a configured alias continue to use
`MLX_GLM_MAX_INPUT_CHARS` as a conservative fallback guard. This prevents an
unprofiled interactive request from accidentally consuming the long-context
service lane.

## Coding Workspace behavior

Coding Workspaces now count the serialized messages and native tool schemas in
estimated tokens. The old 64,000-character reset remains the fallback for
unprofiled models, but GLM coding aliases use their explicit token thresholds.
The selected alias also controls the completion reserve; the previous global
8,192-token ceiling no longer truncates the coding and long profiles.

Tool results injected into the conversation remain bounded by
`CODING_AGENT_TOOL_CONTEXT_CHARS`. Persisted diagnostic results are limited to
20,000 characters by default, preventing one command result from consuming the
entire legacy fallback window. Complete repository files and generated
artifacts remain in the workspace and can be reread selectively.

## Deployment

The repository alias file is loaded once per Gateway process. After deployment,
restart Gateway so `/var/lib/gateway/config/model_aliases.json` is reseeded or
updated according to the normal deployment path and the alias cache is rebuilt.
The resident MLX model does not need to be re-downloaded; these profiles route
to the same model with different budgets and chat-template policy.
'''
