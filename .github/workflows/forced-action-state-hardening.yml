name: Harden forced-action state

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: forced-action-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/enforce-coding-forced-action'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enforce-coding-forced-action
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/gateway/app/requirements.freeze.txt
            services/gateway/tests/requirements.freeze.txt
      - name: Apply state hardening
        run: python services/gateway/tools/harden_forced_action_state.py
      - name: Install Gateway dependencies
        shell: bash
        run: |
          python -m pip install --quiet \
            -r services/gateway/app/requirements.freeze.txt \
            -r services/gateway/tests/requirements.freeze.txt
          python -m pip check
      - name: Prepare runtime paths
        shell: bash
        run: |
          sudo mkdir -p \
            /var/lib/gateway/app \
            /var/lib/gateway/config \
            /var/lib/gateway/data/agent \
            /var/lib/gateway/data/coding/tasks \
            /var/lib/gateway/data/coding/workspaces \
            /var/lib/gateway/data/model_benchmarks \
            /var/lib/gateway/data/model_tool_qualification \
            /var/lib/gateway/data/sentinel \
            /var/lib/gateway/data/tools \
            /var/lib/gateway/data/ui_chats \
            /var/lib/gateway/data/ui_files \
            /var/lib/gateway/data/ui_images \
            /var/lib/gateway/data/voice_library \
            /var/lib/gateway/tools \
            /workspace/nexus/souls
          sudo chown -R "$USER:$USER" /var/lib/gateway /workspace/nexus
      - name: Validate focused and full suites
        timeout-minutes: 28
        env:
          PYTHONPATH: services/gateway
          GATEWAY_BEARER_TOKEN: test-token
        shell: bash
        run: |
          python -m py_compile \
            services/gateway/app/coding_agent.py \
            services/gateway/app/coding_forced_action.py \
            services/gateway/app/coding_semantic_memory.py
          python -m pytest -q --tb=short \
            services/gateway/tests/test_coding_forced_action.py \
            services/gateway/tests/test_coding_stagnation_resilience.py \
            services/gateway/tests/test_coding_mission_finalization.py \
            services/gateway/tests/test_coding_runtime_guardrails.py
          python -m pytest -q --tb=short services/gateway/tests
          git diff --check
      - name: Commit hardening and remove temporary files
        shell: bash
        run: |
          rm -f \
            services/gateway/tools/harden_forced_action_state.py \
            .github/workflows/forced-action-state-hardening.yml
          git config user.name "Nexus Forced Action Bot"
          git config user.email "nexus-forced-action@users.noreply.github.com"
          git add -A
          git commit -m "Harden forced-action state transitions"
          git push origin HEAD:agent/enforce-coding-forced-action
