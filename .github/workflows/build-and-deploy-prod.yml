name: Build and Deploy (prod)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry-backed CI prerequisites
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=0
          for name in CONTAINER_REGISTRY REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::This workflow is only for the optional registry-backed CI deploy path. Standard Nexus deployment is commit, push, then deploy the intended branch on the target host with deploy/scripts/deploy.sh or deploy/scripts/remote-deploy.sh."
            exit 1
          fi

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/nexus-gateway:prod-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to prod host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/nexus
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            ./deploy/scripts/deploy.sh prod main
