services:
  deployment-control:
    build:
      context: ./services/deployment-control
      dockerfile: Dockerfile
    container_name: nexus-deployment-control
    user: "${DEPLOY_CONTROL_UID:-1000}:${DEPLOY_CONTROL_GID:-1000}"
    ports:
      - "${DEPLOY_CONTROL_BIND_ADDRESS:-127.0.0.1}:${DEPLOY_CONTROL_PORT:-9220}:9220"
    environment:
      - DEPLOY_CONTROL_HOST=${DEPLOY_CONTROL_HOST:-copyfail}
      - DEPLOY_CONTROL_REPO_ROOT=/workspace
      - DEPLOY_CONTROL_STATE_DIR=/var/lib/deployment-control
      - DEPLOY_CONTROL_TOKEN_FILE=/run/secrets/deploy-control-token
      - DEPLOY_CONTROL_ALLOWED_HOSTS=${DEPLOY_CONTROL_ALLOWED_HOSTS:-ai2,ada2,meltdown,migraine,stackrot}
      - DEPLOY_CONTROL_ALLOWED_COMPONENTS=${DEPLOY_CONTROL_ALLOWED_COMPONENTS:-ace-step,cloudflared,deployment-control,etcd,followyourcanvas,gateway,heartmula,hunyuan-video,images,invokeai,lifecycle-manager,lighton-ocr,ltx-video,luxtts,mediamtx,mlx,nginx,personaplex,qwen3-tts,sdxl-turbo,telegram-bot,tts,vllm,vllm-embeddings,vllm-fast,vllm-meltdown,vllm-strong}
      - DEPLOY_CONTROL_ALLOWED_BRANCHES=${DEPLOY_CONTROL_ALLOWED_BRANCHES:-main}
      - DEPLOY_CONTROL_ENFORCE_TOPOLOGY=${DEPLOY_CONTROL_ENFORCE_TOPOLOGY:-true}
      - DEPLOY_CONTROL_SYNC_REPO=${DEPLOY_CONTROL_SYNC_REPO:-true}
      - HOME=/var/lib/deployment-control/home
      - SOPS_AGE_KEY_FILE=/run/secrets/sops-age-key
      - NEXUS_DEPLOY_SSH_IDENTITY_FILE=/run/secrets/deployment-ssh-key
      - NEXUS_DEPLOY_SSH_KNOWN_HOSTS_FILE=/run/secrets/deployment-known-hosts
      - GIT_SSH_COMMAND=ssh -i /run/secrets/deployment-ssh-key -o UserKnownHostsFile=/run/secrets/deployment-known-hosts -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    volumes:
      - .:/workspace
      - ${DEPLOY_CONTROL_STATE_BIND_SOURCE:-/data/nexus-runtime/deployment-control}:/var/lib/deployment-control
      - ${DEPLOY_CONTROL_SSH_KEY_FILE:-/home/ai/.ssh/nexus-deployment-control}:/run/secrets/deployment-ssh-key:ro
      - ${DEPLOY_CONTROL_SSH_KNOWN_HOSTS_FILE:-/home/ai/.ssh/known_hosts}:/run/secrets/deployment-known-hosts:ro
      - ${DEPLOY_CONTROL_SOPS_AGE_KEY_FILE:-/home/ai/.config/sops/age/keys.txt}:/run/secrets/sops-age-key:ro
      - ${DEPLOY_CONTROL_TOKEN_FILE:-/data/nexus-runtime/deployment-control/token}:/run/secrets/deploy-control-token:ro
    restart: unless-stopped
