services:
  # Dev override for the Gateway service.
  # Shared host paths:
  # - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/gateway-dev/data is gateway dev data dir
  # - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/gateway/config is shared read-only config across gateway modes
  gateway:
    container_name: nexus-gateway-dev
    ports:
      - "${DEV_GATEWAY_PORT:-18800}:8800"
      - "${DEV_OBSERVABILITY_PORT:-18801}:8801"
    environment:
      - GATEWAY_BEARER_TOKEN=${DEV_GATEWAY_BEARER_TOKEN:-dev-change-me}
      - VOICE_LIBRARY_DIR=/var/lib/tts_refs
      - MODEL_ALIASES_PATH=/var/lib/gateway/config/model_aliases.json
      - AGENT_SPECS_PATH=/var/lib/gateway/config/agent_specs.json
      - CODING_WORKSPACE_ROOT=/var/lib/gateway/data/coding/workspaces
      - CODING_TASKS_DIR=/var/lib/gateway/data/coding/tasks
      - CODING_DEFAULT_REPO_URL=${CODING_DEFAULT_REPO_URL:-https://github.com/gevanoff/nexus.git}
      - CODING_ALLOWED_REPOS=${CODING_ALLOWED_REPOS:-https://github.com/gevanoff/nexus.git}
      - CODING_REQUIRE_ADMIN=${CODING_REQUIRE_ADMIN:-true}
      - CODING_GIT_TOKEN=${CODING_GIT_TOKEN:-}
      - TOOLS_REGISTRY_PATH=/var/lib/gateway/config/tools_registry.json
    volumes:
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/gateway-dev/data:/var/lib/gateway/data
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/tts_refs:/var/lib/tts_refs
      - ${NEXUS_RUNTIME_ROOT:?NEXUS_RUNTIME_ROOT must be set}/gateway/config:/var/lib/gateway/config:ro
      - ./services/gateway/app:/var/lib/gateway/app
      - ./services/gateway/tools:/var/lib/gateway/tools

networks:
  nexus:
    name: nexus-dev

volumes: {}
