services:
  vllm-meltdown:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    container_name: nexus-vllm-meltdown
    gpus: all
    ports:
      - "${VLLM_MELTDOWN_PORT:-8004}:8000"
    environment:
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NVIDIA_VISIBLE_DEVICES=${VLLM_MELTDOWN_CUDA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${VLLM_MELTDOWN_CUDA_VISIBLE_DEVICES:-all}
      - NEXUS_VLLM_MODEL=${VLLM_MODEL_MELTDOWN:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - NEXUS_VLLM_SERVED_MODEL_NAME=${VLLM_MELTDOWN_SERVED_MODEL_NAME:-${VLLM_MODEL_MELTDOWN:-Qwen/Qwen2.5-7B-Instruct-AWQ}}
      - NEXUS_VLLM_TOKENIZER=${VLLM_MELTDOWN_TOKENIZER:-${VLLM_MODEL_MELTDOWN:-Qwen/Qwen2.5-7B-Instruct-AWQ}}
      - NEXUS_VLLM_TOKENIZER_MODE=${VLLM_MELTDOWN_TOKENIZER_MODE:-}
      - NEXUS_VLLM_CONFIG_FORMAT=${VLLM_MELTDOWN_CONFIG_FORMAT:-hf}
      - NEXUS_VLLM_LOAD_FORMAT=${VLLM_MELTDOWN_LOAD_FORMAT:-auto}
      - NEXUS_VLLM_TENSOR_PARALLEL_SIZE=${VLLM_MELTDOWN_TENSOR_PARALLEL_SIZE:-1}
      - NEXUS_VLLM_GPU_MEMORY_UTILIZATION=${VLLM_MELTDOWN_GPU_MEMORY_UTILIZATION:-0.58}
      - NEXUS_VLLM_MAX_MODEL_LEN=${VLLM_MELTDOWN_MAX_MODEL_LEN:-8192}
      - NEXUS_VLLM_CPU_OFFLOAD_GB=${VLLM_MELTDOWN_CPU_OFFLOAD_GB:-0}
      - NEXUS_VLLM_DTYPE=${VLLM_MELTDOWN_DTYPE:-}
      - NEXUS_VLLM_KV_CACHE_DTYPE=${VLLM_MELTDOWN_KV_CACHE_DTYPE:-}
      - NEXUS_VLLM_ENFORCE_EAGER=${VLLM_MELTDOWN_ENFORCE_EAGER:-true}
      - NEXUS_VLLM_ENABLE_AUTO_TOOL_CHOICE=false
      - NEXUS_VLLM_EXCLUDE_TOOLS_WHEN_TOOL_CHOICE_NONE=true
      - VLLM_USE_FLASHINFER_SAMPLER=${VLLM_MELTDOWN_USE_FLASHINFER_SAMPLER:-0}
    entrypoint: ["/bin/sh", "/usr/local/bin/nexus-run-vllm-openai"]
    volumes:
      - ./deploy/scripts/run-vllm-openai.sh:/usr/local/bin/nexus-run-vllm-openai:ro
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${VLLM_MELTDOWN_HEALTHCHECK_START_PERIOD:-300s}

  vllm-meltdown-registrar:
    build:
      context: ./services/service-registrar
      dockerfile: Dockerfile
    environment:
      - NEXUS_SERVICE_NAME=${VLLM_MELTDOWN_SERVICE_NAME:-vllm-meltdown}
      - NEXUS_SERVICE_BASE_URL=${VLLM_MELTDOWN_ADVERTISE_BASE_URL:-${VLLM_MELTDOWN_BASE_URL:-http://vllm-meltdown:8000/v1}}
      - NEXUS_SERVICE_HEALTH_URL=http://vllm-meltdown:8000/v1/models
      - NEXUS_SERVICE_BACKEND_CLASS=${VLLM_MELTDOWN_BACKEND_CLASS:-local_vllm_meltdown}
      - ETCD_URL=${ETCD_URL:-http://etcd:2379}
      - NEXUS_REGISTRATION_INTERVAL_SEC=${NEXUS_REGISTRATION_INTERVAL_SEC:-30}
      - NEXUS_REGISTRATION_TIMEOUT_SEC=${NEXUS_REGISTRATION_TIMEOUT_SEC:-5}
    depends_on:
      - vllm-meltdown
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
