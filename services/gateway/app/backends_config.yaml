# Backend configuration: defines backend classes, capabilities, and enforcement policies
# This is the single source of truth for routing, admission control, and payload policies

backends:
  local_vllm:
    class: local_vllm
    provider: vllm
    base_url: ${VLLM_BASE_URL}
    description: vLLM strong chat backend
    supported_capabilities:
      - chat
    concurrency_limits:
      chat: 8
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: false

  local_vllm_fast:
    class: local_vllm_fast
    provider: vllm
    base_url: ${VLLM_FAST_BASE_URL}
    description: vLLM fast chat backend
    supported_capabilities:
      - chat
    concurrency_limits:
      chat: 8
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: false

  local_vllm_embeddings:
    class: local_vllm_embeddings
    provider: vllm
    base_url: ${VLLM_EMBEDDINGS_BASE_URL}
    description: vLLM embeddings backend
    supported_capabilities:
      - embeddings
    concurrency_limits:
      embeddings: 8
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: false

  local_vllm_meltdown:
    class: local_vllm_meltdown
    provider: vllm
    base_url: ${VLLM_MELTDOWN_BASE_URL}
    description: Dedicated Meltdown vLLM chat backend for Cinder
    supported_capabilities:
      - chat
    concurrency_limits:
      chat: 2
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: false
      max_input_chars: 24000

  local_mlx:
    class: local_mlx
    provider: mlx
    base_url: ${MLX_BASE_URL}
    description: Optional MLX accelerator backend
    supported_capabilities:
      - chat
      - embeddings
    concurrency_limits:
      chat: 4
      embeddings: 2
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: true

  local_mlx_migraine:
    class: local_mlx_migraine
    provider: mlx
    base_url: ${MLX_MIGRAINE_BASE_URL}
    description: Small MLX chat backend on the 8 GB migraine host
    supported_capabilities:
      - chat
    concurrency_limits:
      chat: 1
    health:
      liveness: /models
      readiness: /models
    payload_policy:
      supports_tool_calling: false
      max_input_chars: 24000

  gpu_fast:
    class: gpu_fast
    base_url: ${SDXL_TURBO_BASE_URL}
    description: SDXL Turbo image backend
    supported_capabilities:
      - images
    concurrency_limits:
      images: 2
    health:
      liveness: /health
      readiness: /readyz
    payload_policy:
      images_format: url
      images_allow_base64: true
      images_max_bytes: 50000000

  gpu_heavy:
    class: gpu_heavy
    base_url: ${IMAGES_HTTP_BASE_URL}
    description: InvokeAI-backed OpenAI images shim
    supported_capabilities:
      - images
    concurrency_limits:
      images: 2
    health:
      liveness: /healthz
      readiness: /readyz
    payload_policy:
      images_format: url
      images_allow_base64: true
      images_max_bytes: 50000000

  heartmula_music:
    class: heartmula_music
    base_url: ${HEARTMULA_BASE_URL}
    description: HeartMula music generator (HTTP)
    supported_capabilities:
      - music
    concurrency_limits:
      music: 1
    health:
      liveness: /health
      readiness: /readyz
    payload_policy: {}

  ace_step_music:
