services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    container_name: nexus-vllm
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - NEXUS_VLLM_MODEL=${VLLM_MODEL_STRONG:-ConicCat/Magistral-Small-2509-Text-Only-FP8-Dynamic}
      - NEXUS_VLLM_SERVED_MODEL_NAME=${VLLM_SERVED_MODEL_NAME:-${VLLM_MODEL_STRONG:-ConicCat/Magistral-Small-2509-Text-Only-FP8-Dynamic}}
      - NEXUS_VLLM_TOKENIZER=${VLLM_TOKENIZER:-${VLLM_MODEL_STRONG:-ConicCat/Magistral-Small-2509-Text-Only-FP8-Dynamic}}
      - NEXUS_VLLM_TOKENIZER_MODE=${VLLM_TOKENIZER_MODE:-}
      - NEXUS_VLLM_CONFIG_FORMAT=${VLLM_CONFIG_FORMAT:-}
      - NEXUS_VLLM_LIMIT_MM_PER_PROMPT=${VLLM_LIMIT_MM_PER_PROMPT:-}
      - NEXUS_VLLM_SKIP_MM_PROFILING=${VLLM_SKIP_MM_PROFILING:-false}
      - NEXUS_VLLM_LOAD_FORMAT=${VLLM_LOAD_FORMAT:-auto}
      - NEXUS_VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-32768}
      - NEXUS_VLLM_ENFORCE_EAGER=${VLLM_ENFORCE_EAGER:-false}
      - NEXUS_VLLM_ENABLE_AUTO_TOOL_CHOICE=${VLLM_ENABLE_AUTO_TOOL_CHOICE:-false}
      - NEXUS_VLLM_TOOL_CALL_PARSER=${VLLM_TOOL_CALL_PARSER:-}
      - NEXUS_VLLM_TOOL_PARSER_PLUGIN=${VLLM_TOOL_PARSER_PLUGIN:-}
      - NEXUS_VLLM_EXCLUDE_TOOLS_WHEN_TOOL_CHOICE_NONE=${VLLM_EXCLUDE_TOOLS_WHEN_TOOL_CHOICE_NONE:-true}
      - NEXUS_VLLM_REASONING_PARSER=${VLLM_REASONING_PARSER:-}
      - NEXUS_VLLM_CHAT_TEMPLATE=${VLLM_CHAT_TEMPLATE:-}
      - NEXUS_VLLM_CHAT_TEMPLATE_CONTENT_FORMAT=${VLLM_CHAT_TEMPLATE_CONTENT_FORMAT:-}
    entrypoint: ["/bin/sh", "/usr/local/bin/nexus-run-vllm-openai"]
    volumes:
      - ../deploy/scripts/run-vllm-openai.sh:/usr/local/bin/nexus-run-vllm-openai:ro
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
