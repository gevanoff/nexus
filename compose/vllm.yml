services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    container_name: nexus-vllm
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      - HF_HOME=${HF_HOME:-/var/lib/huggingface}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL_STRONG:-unsloth/Qwen3-30B-A3B-FP8}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-${VLLM_MODEL_STRONG:-unsloth/Qwen3-30B-A3B-FP8}}
      - --generation-config
      - vllm
      - --load-format
      - "${VLLM_LOAD_FORMAT:-auto}"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
    volumes:
      - ${HF_HOME_BIND_SOURCE:-/var/lib/huggingface}:${HF_HOME:-/var/lib/huggingface}
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  nexus:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes: {}
