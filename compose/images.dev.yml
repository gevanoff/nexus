services:
  images:
    container_name: nexus-images-dev
    ports:
      - "${DEV_IMAGES_PORT:-17860}:7860"
    environment:
      - SHIM_MODE=${DEV_IMAGES_SHIM_MODE:-stub}
      - SHIM_PORT=7860
    volumes:
      - ${NEXUS_RUNTIME_ROOT:-../.runtime}/images-dev/data:/data
      - ${NEXUS_RUNTIME_ROOT:-../.runtime}/images-dev/models:/data/models

networks:
  nexus:
    name: nexus-dev

volumes: {}
